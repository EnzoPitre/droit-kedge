if(q.finished){let n=q.questions.filter(x=>q.answers[x.id]===x.answer).length,p=Math.round(n/q.questions.length*100);return `<button class="backlink" data-action="quizReset">← Nouveau quiz</button><div class="card quiz-result" style="max-width:680px;margin:30px auto"><div class="eyebrow">SESSION TERMINÉE</div><h2>Ton résultat</h2><div class="number-big">${p} %</div><p class="muted">${n} réponses correctes sur ${q.questions.length}</p><div class="quiz-line mt-3"><span style="width:${p}%"></span></div><p class="mt-3">${p>=85?'Excellent : consolide les cas complexes.':p>=65?'Bonne base : revois tes erreurs et entraîne-toi sur des cas.':'Révise les chapitres correspondants avant de refaire une série.'}</p><div class="rowbuttons" style="justify-content:center"><button class="btn primary" data-action="quizReset">Nouvelle session</button><button class="btn outline" data-action="nav" data-id="cases">Faire des cas pratiques</button></div></div><h2 class="section-title">Revoir les réponses</h2>${q.questions.filter(x=>q.answers[x.id]!==x.answer).map(x=>`<div class="card mt-1"><strong>${e(x.q)}</strong><p class="small muted">Ta réponse : ${e(x.options[q.answers[x.id]]||'Non renseignée')}</p><p class="small" style="color:var(--green)">Bonne réponse : ${e(x.options[x.answer])}</p><p class="small muted">${e(x.why)}</p></div>`).join('')||'<div class="callout ok">Aucune erreur dans cette session.</div>'}`}
let item=q.questions[q.index],valid=q.answers[item.id]!==undefined,selected=valid?q.answers[item.id]:q.selected;return `<div class="quiz-shell"><div class="detail-top"><button class="backlink" data-action="quizReset">← Abandonner la session</button><span class="chip blue">Question ${q.index+1} / ${q.questions.length}</span></div><div class="quiz-line"><span style="width:${((q.index+1)/q.questions.length)*100}%"></span></div><div class="eyebrow mt-3">${e(DB.modules.find(m=>m.id===item.topic)?.title||'Droit des sociétés')}</div><h2 class="quiz-question">${e(item.q)}</h2>${item.options.map((opt,i)=>`<button class="quiz-option ${valid?(i===item.answer?'correct':i===selected?'wrong':''):selected===i?'selected':''}" data-action="quizSelect" data-id="${i}" ${valid?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${e(opt)}</span>${valid&&i===item.answer?`<span class="right">${ico('check',17)}</span>`:''}</button>`).join('')}${valid?`<div class="quiz-explain"><strong>${q.answers[item.id]===item.answer?'Bonne réponse !':'À retenir'}</strong>${e(item.why)}</div>`:''}<div class="card-footer mt-3"><span class="muted small">${valid?'Réponse enregistrée':'Choisis une seule réponse.'}</span><button class="btn primary" data-action="${valid?'quizNext':'quizValidate'}" ${!valid&&selected===null?'disabled':''}>${valid?(q.index===q.questions.length-1?'Afficher mon résultat':'Question suivante'):'Valider ma réponse'} ${ico('arrow',15)}</button></div></div>`}
function flashDeck(){return DB.flashcards.filter(f=>ui.flashTopic==='all'||f.topic===ui.flashTopic)}
function renderFlash(){let topics=['all',...new Set(DB.flashcards.map(x=>x.topic))],deck=flashDeck();ui.flashIndex=Math.min(Math.max(0,ui.flashIndex),Math.max(0,deck.length-1));let f=deck[ui.flashIndex],count=deck.filter(x=>store.flashKnown[x.id]).length;return ptitle('Répétition active','Flashcards','Révise les définitions, articles et distinctions en quelques minutes. Clique sur la carte pour retourner la réponse.')+`<div class="toolbar"><select class="select" id="flashTopic"><option value="all">Tous les thèmes</option>${topics.slice(1).map(id=>`<option value="${e(id)}" ${ui.flashTopic===id?'selected':''}>${e(DB.modules.find(m=>m.id===id)?.title||id)}</option>`).join('')}</select><span class="count">${count} / ${deck.length} connues</span></div>${deck.length?`<div class="flash-area"><div class="card-footer mb-1"><span class="chip blue">Carte ${ui.flashIndex+1} / ${deck.length}</span><span class="chip ${store.flashKnown[f.id]?'green':''}">${store.flashKnown[f.id]?'Mémorisée':'À réviser'}</span></div><div class="flash-card ${ui.flashReveal?'revealed':''}" data-action="flip"><span class="eyebrow">${ui.flashReveal?'RÉPONSE':'QUESTION'}</span>${ui.flashReveal?`<p style="font-size:17px;color:var(--ink)">${e(f.back)}</p>`:`<h2>${e(f.front)}</h2>`}<span class="muted small" style="margin-top:22px">${ui.flashReveal?'Clique pour revoir la question':'Clique pour révéler la réponse'}</span></div><div class="flash-controls"><button class="btn outline" data-action="flashPrev">← Précédente</button><button class="btn ${store.flashKnown[f.id]?'ghost':'primary'}" data-action="flashKnown">${ico('check',14)} ${store.flashKnown[f.id]?'Marquer à revoir':'Je connais'}</button><button class="btn outline" data-action="flashNext">Suivante →</button></div><div class="callout info mt-3">${ico('flash',19)}<div><strong>Raccourcis clavier</strong><p>Flèche gauche / droite : changer de carte · Espace : retourner la carte (hors champ de texte).</p></div></div></div>`:'<div class="card">Aucune flashcard pour ce filtre.</div>'}`}
function renderExam(){const ids=['c5','c16','c15'],exam=ids.map(id=>DB.cases.find(x=>x.id===id));return ptitle('Simulation d’évaluation','Examen blanc · 60 minutes','Trois problèmes juridiques distincts. Aucun QCM : rédige de vrais mini-syllogismes pour chaque situation.')+`<div class="callout warn">${ico('clock',20)}<div><strong>Conditions d’examen recommandées</strong><p>60 minutes : 5 min de lecture et qualification, 45 min de rédaction (15 min/cas), 10 min de relecture. Documents fermés pour un premier essai. La correction n'est révélée que sur demande.</p></div></div><div class="toolbar"><span class="timer" id="timerLabel">00:00</span><button class="btn outline sm" data-action="timer" id="timerBtn">Démarrer le chrono</button><button class="btn outline sm" data-action="examReset">Effacer mes brouillons d'examen</button><span class="count">3 cas · auto-évaluation</span></div>${exam.map((c,i)=>`<div class="exam-question"><div class="eyebrow">PARTIE ${i+1} / 3 · ${i===0?'SOCIÉTÉ EN FORMATION':i===1?'NULLITÉS 2025':'CAUTIONNEMENT'}</div><h3>${e(c.title)}</h3><p>${e(c.facts)}</p><p><strong>Question :</strong> ${e(c.questions)}</p><label class="label mt-2" for="exam-${c.id}">Ta réponse structurée</label><textarea class="textarea" id="exam-${c.id}" data-exam="${c.id}" placeholder="Problème de droit / Règle / Application / Conclusion…">${e(store.examAnswers[c.id]||'')}</textarea>${ui.examReveal?`<div class="fine-box mt-2"><b>Règles à mobiliser</b>${c.rules.map(e).join(' · ')}<div class="divider mt-1"></div><b>Application et conclusion</b>${e(c.application.join(' '))} ${e(c.conclusion.join(' '))}</div>`:''}</div>`).join('')}<div class="rowbuttons"><button class="btn primary" data-action="examReveal">${ui.examReveal?'Masquer les corrigés':'Afficher les trois corrigés'} ${ico('arrow',15)}</button><button class="btn outline" data-action="export">Sauvegarder ma progression</button></div><div class="callout info mt-3">${ico('scale',20)}<div><strong>Pour auto-évaluer chaque cas (/20)</strong><p>Qualification des faits et problème de droit : 4 points · Bonne règle et conditions : 6 points · Application circonstanciée : 7 points · Conclusion et nuance : 3 points. Cette grille est pédagogique, pas un barème officiel de KEDGE.</p></div></div>`}
const COMPARISON={

'SCA':{'Capital minimum':'37 000 € (règle générale)','Nombre d’associés':'4+ en général (1 commandité, 3 commanditaires)','Responsabilité':'Commandités : indéfinie/solidaire ; commanditaires : apports','Titres':'Actions pour commanditaires','Direction':'Gérants ; conseil de surveillance','Cession':'Selon qualité et titres','Apport en industrie':'Pour commandités ; hors capital','Numéraire initial':'50 % minimum ; solde en 5 ans','Personnalité morale':'À immatriculation RCS'}};
ui.cmpA='SARL';ui.cmpB='SAS';
function renderCompare(){let A=COMPARISON[ui.cmpA],B=COMPARISON[ui.cmpB];return ptitle('Aide à la qualification','Comparateur de sociétés','Compare deux formes juridiques sur leurs points juridiques décisifs. Les régimes spéciaux et exceptions doivent être vérifiés dans les textes.')+`<div class="toolbar"><span class="small muted">Comparer</span><select id="cmpA" class="select">${Object.keys(COMPARISON).map(k=>`<option ${k===ui.cmpA?'selected':''}>${k}</option>`).join('')}</select><span class="muted">avec</span><select id="cmpB" class="select">${Object.keys(COMPARISON).map(k=>`<option ${k===ui.cmpB?'selected':''}>${k}</option>`).join('')}</select><button class="btn outline sm" data-action="swap">Inverser</button></div><div class="table-scroll"><table class="comparison"><thead><tr><th>Critère</th><th>${e(ui.cmpA)}</th><th>${e(ui.cmpB)}</th></tr></thead><tbody>${Object.keys(A).map(k=>`<tr><td>${e(k)}</td><td>${e(A[k])}</td><td>${e(B[k])}</td></tr>`).join('')}</tbody></table></div><div class="callout warn mt-2">${ico('alert',20)}<div><strong>Un tableau pour qualifier, pas pour trancher automatiquement</strong><p>La responsabilité des associés peut être affectée par une caution personnelle, une faute propre ou des régimes spéciaux. Le capital minimum et les règles de gouvernance doivent être rattachés à la forme et à la date du cas.</p></div></div><h2 class="section-title">Comparaison rapide : les trois pièges courants</h2><div class="grid three"><div class="card"><h3 class="card-title">SARL ≠ SAS</h3><p class="card-desc">Parts sociales contre actions ; gérant contre président ; cadre légal plus strict contre liberté statutaire.</p></div><div class="card"><h3 class="card-title">Responsabilité limitée ≠ aucun risque</h3><p class="card-desc">L'associé peut être engagé personnellement en cas de cautionnement ou d'autre fondement distinct.</p></div><div class="card"><h3 class="card-title">RNE ≠ RCS</h3><p class="card-desc">Le RNE centralise les informations, mais le RCS reste important pour la personnalité morale des sociétés.</p></div></div>`}
function renderLex(){let q=ui.query.toLowerCase().trim();let items=DB.flashcards.filter(f=>!q||(f.front+' '+f.back).toLowerCase().includes(q));return ptitle('Index des notions','Lexique juridique',`${DB.flashcards.length} définitions clés, faciles à retrouver et à réviser.`)+`<div class="toolbar"><input class="input searchbox" id="lexSearch" placeholder="Rechercher un mot, un article…" value="${e(ui.query)}"><span class="count">${items.length} termes</span></div><div class="grid two">${items.map(f=>`<div class="card"><span class="chip blue">${e(DB.modules.find(m=>m.id===f.topic)?.group||'Définition')}</span><h3 class="card-title">${e(f.front)}</h3><p class="card-desc">${e(f.back)}</p></div>`).join('')||'<p>Aucun terme trouvé.</p>'}</div>`}
function renderSources(){let slides=DB.slides.filter(s=>!ui.slideFilter||(s.body+' '+s.n).toLowerCase().includes(ui.slideFilter.toLowerCase()));return ptitle('Traçabilité','Sources du cours & textes','Le contenu est basé sur les 11 fichiers transmis. Les ressources en ligne ne remplacent pas les supports de ton enseignant.')+`<div class="callout info"><div>${ico('file',22)}</div><div><strong>Comment la plateforme a été construite</strong><p>Le diaporama KEDGE (86 slides) sert de colonne vertébrale aux thèmes 1 et 2. Les PDF complètent les formes sociales, la gouvernance, les financements et les opérations. Des mises à jour ciblées des textes de 2025 ont été ajoutées et signalées. Les cas sont des exercices originaux construits à partir de ces mécanismes, et non des sujets officiels.</p></div></div><div class="grid two mt-3" style="align-items:start"><div class="card"><h2 class="section-title mt-0">Les 11 supports transmis</h2>${Object.entries(DB.sources).filter(([key])=>key!=='legifrance').map(([k,v],i)=>`<div class="source-row"><div class="document-icon">${k==='cours'?'PPT':'PDF'}</div><div><h3>${e(v)}</h3><p>${k==='cours'?'Transcription des 86 diapositives disponible ci-dessous.':`Utilisé dans les chapitres associés : ${e(DB.modules.filter(m=>m.refs.some(r=>r.startsWith(k+':'))).map(m=>m.title).slice(0,3).join(' · ')||'Notions transversales')}`}</p></div></div>`).join('')}</div><div class="card"><h2 class="section-title mt-0">Articles officiels à retrouver</h2><p class="muted small">Liens Légifrance (connexion Internet nécessaire). Certains liens ouvrent une recherche par numéro d’article ; consulte toujours la version en vigueur à la date pertinente.</p>${DB.legal.map(x=>`<div class="source-row" style="padding:11px 0"><div class="document-icon" style="width:58px;height:31px">${e(x[0])}</div><div><a target="_blank" rel="noopener noreferrer" href="${e(x[3])}" style="font-size:12px;font-weight:750">${e(x[1])} · ${e(x[0])} ↗</a><p>${e(x[2])}</p></div></div>`).join('')}</div></div><div class="section-head"><h2 class="section-title">Archive du diaporama (86 slides)</h2><span class="chip">Transcription textuelle</span></div><p class="page-sub">Pour retrouver une règle dans la progression exacte du cours, notamment les références jurisprudentielles. La mise en page visuelle d’origine n’est pas reproduite.</p><div class="toolbar"><input class="input searchbox" id="slideSearch" placeholder="Filtrer les diapositives : affectio, 1832, nullité…" value="${e(ui.slideFilter)}"><span class="count">${slides.length} diapositives</span></div>${slides.map(s=>`<details><summary>Diapositive ${s.n} · ${e(s.body.split('\n').find((l,i)=>i>0&&l.trim().length>7)||s.body.split('\n')[0]).slice(0,100)}</summary><pre>${e(s.body)}</pre></details>`).join('')}`}
function renderSearch(){let q=ui.query.toLowerCase().trim();if(!q)return ptitle('Recherche','Rechercher dans JURIS','Saisis un terme dans la barre de recherche pour retrouver un chapitre, un cas ou une définition.');let a=DB.modules.filter(m=>(m.title+' '+m.lead+' '+m.sections.map(s=>s.h+' '+s.p).join(' ')).toLowerCase().includes(q)),b=DB.cases.filter(c=>(c.title+' '+c.facts+' '+c.questions).toLowerCase().includes(q)),d=DB.flashcards.filter(f=>(f.front+' '+f.back).toLowerCase().includes(q)).slice(0,10),s=DB.slides.filter(sl=>sl.body.toLowerCase().includes(q)).slice(0,8);return ptitle('Recherche globale',`Résultats pour « ${ui.query} »`,'Chapitres, cas pratiques, définitions et transcription du diaporama.')+`<div class="small muted">${a.length+b.length+d.length+s.length} résultat(s) affiché(s)</div><h2 class="section-title">Cours (${a.length})</h2>${a.map(m=>`<div class="search-result"><div><strong>${e(m.title)}</strong><p>${e(m.lead).slice(0,160)}</p></div><button class="btn ghost sm" data-action="lesson" data-id="${m.id}">Ouvrir</button></div>`).join('')||'<p class="muted">Aucun.</p>'}<h2 class="section-title">Cas pratiques (${b.length})</h2>${b.map(c=>`<div class="search-result"><div><strong>${e(c.title)}</strong><p>${e(c.questions)}</p></div><button class="btn ghost sm" data-action="case" data-id="${c.id}">Ouvrir</button></div>`).join('')||'<p class="muted">Aucun.</p>'}<h2 class="section-title">Définitions (${d.length})</h2>${d.map(f=>`<div class="search-result"><div><strong>${e(f.front)}</strong><p>${e(f.back)}</p></div></div>`).join('')||'<p class="muted">Aucun.</p>'}<h2 class="section-title">Diaporama (${s.length})</h2>${s.map(x=>`<details><summary>Slide ${x.n}</summary><pre>${e(x.body)}</pre></details>`).join('')||'<p class="muted">Aucun.</p>'}`}
function render(){renderNav();const pages={dashboard:renderDashboard,courses:renderCourses,lesson:renderLesson,cases:renderCases,case:renderCase,method:renderMethod,quiz:renderQuiz,flash:renderFlash,exam:renderExam,compare:renderCompare,lexicon:renderLex,sources:renderSources,search:renderSearch};let content=(pages[ui.route]||renderDashboard)();$('#app').innerHTML=content+`<footer class="footer">JURIS · Droit des sociétés · KEDGE Study Studio · Révisions privées, hors ligne<br>Supports pédagogiques + points législatifs actualisés au 16 novembre 2026 · Aucune notation automatique ne remplace une correction juridique.</footer>`;$('#globalSearch').value=ui.route==='search'?ui.query:''}
function saveCaseCurrent(){let c=$('#caseAnswer');if(c&&ui.id){store.caseAnswers[ui.id]=c.value;persist()}}
function saveExamCurrent(){$$('[data-exam]').forEach(t=>{store.examAnswers[t.dataset.exam]=t.value});persist()}
function timeText(ms){let s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
setInterval(()=>{if(!ui.timerRunning)return;let ms=ui.timerElapsed+(Date.now()-ui.timerSince),el=$('#timerLabel');if(el)el.textContent=timeText(ms)},1000);
function timerToggle(){if(ui.timerRunning){ui.timerElapsed+=Date.now()-ui.timerSince;ui.timerRunning=false;toast('Chrono en pause')}else{ui.timerSince=Date.now();ui.timerRunning=true;toast('Chrono lancé')}let el=$('#timerBtn');if(el)el.textContent=ui.timerRunning?'Mettre en pause':'Reprendre le chrono';let label=$('#timerLabel');if(label)label.textContent=timeText(ui.timerElapsed)}
function exportProgress(){const data={version:1,exportedAt:new Date().toISOString(),progress:store};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='JURIS_sauvegarde_revisions.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Sauvegarde exportée')}
const methodTemplate=`EN L’ESPÈCE : [qualifier les faits : personnes, forme, dates, actes]\n\nPROBLÈME DE DROIT : [poser une question juridique abstraite et précise]\n\nEN DROIT (MAJEURE) : [citer les textes, règles, conditions et éventuelles exceptions]\n\nEN L’ESPÈCE (MINEURE) : [appliquer chaque condition aux faits et discuter les points incertains]\n\nPAR CONSÉQUENT : [solution, sanction exacte et réserve si nécessaire]`;
const actionHandlers={
nav:el=>{ui.query='';go(el.dataset.id)},lesson:el=>go('lesson',el.dataset.id),case:el=>go('case',el.dataset.id),
mobile:()=>$('#sidebar').classList.toggle('open'),theme:()=>{store.theme=store.theme==='light'?'dark':'light';persist();render()},print:()=>window.print(),done:el=>{store.done[el.dataset.id]=!store.done[el.dataset.id];persist();render();toast(store.done[el.dataset.id]?'Chapitre terminé':'Statut réinitialisé')},anchor:el=>document.getElementById(el.dataset.id)?.scrollIntoView({behavior:'smooth',block:'start'}),
hint:()=>{ui.caseHint=!ui.caseHint;saveCaseCurrent();render()},timer:()=>timerToggle(),saveCase:()=>{saveCaseCurrent();toast('Brouillon enregistré')},analysis:()=>{saveCaseCurrent();ui.caseCheck=!ui.caseCheck;render()},revealCase:()=>{saveCaseCurrent();ui.caseShow=!ui.caseShow;ui.caseCheck=false;render();if(ui.caseShow)setTimeout(()=>$('#correction')?.scrollIntoView({behavior:'smooth',block:'start'}),30)},reviewCase:()=>{store.caseReviewed[ui.id]=!store.caseReviewed[ui.id];persist();render();toast('Progression mise à jour')},
startQuiz:()=>startQuiz(),quizReset:()=>{if(ui.quiz&&!ui.quiz.finished&&!confirm('Abandonner la session de quiz actuelle ?'))return;ui.quiz=null;render()},quizSelect:el=>{if(!ui.quiz)return;let it=ui.quiz.questions[ui.quiz.index];if(ui.quiz.answers[it.id]!==undefined)return;ui.quiz.selected=Number(el.dataset.id);render()},quizValidate:()=>{let q=ui.quiz;if(q?.selected===null||!q)return;let it=q.questions[q.index];q.answers[it.id]=q.selected;render()},quizNext:()=>{let q=ui.quiz;if(!q)return;if(q.index<q.questions.length-1){q.index++;q.selected=null;render()}else{q.finished=true;let ok=q.questions.filter(x=>q.answers[x.id]===x.answer).length;store.quizResults.push({date:new Date().toISOString(),percent:Math.round(ok/q.questions.length*100),total:q.questions.length});if(store.quizResults.length>60)store.quizResults.shift();persist();render()}},
flip:()=>{ui.flashReveal=!ui.flashReveal;render()},flashNext:()=>{let len=flashDeck().length;ui.flashIndex=(ui.flashIndex+1)%len;ui.flashReveal=false;render()},flashPrev:()=>{let len=flashDeck().length;ui.flashIndex=(ui.flashIndex-1+len)%len;ui.flashReveal=false;render()},flashKnown:()=>{let f=flashDeck()[ui.flashIndex];store.flashKnown[f.id]=!store.flashKnown[f.id];persist();render()},
swap:()=>{[ui.cmpA,ui.cmpB]=[ui.cmpB,ui.cmpA];render()},copyMethod:()=>{navigator.clipboard?.writeText(methodTemplate).then(()=>toast('Modèle copié')).catch(()=>{let t=document.createElement('textarea');t.value=methodTemplate;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('Modèle copié')})},
examReveal:()=>{saveExamCurrent();ui.examReveal=!ui.examReveal;render()},examReset:()=>{if(confirm('Effacer les 3 réponses de ton examen blanc ?')){store.examAnswers={};persist();ui.examReveal=false;render()}},export:()=>exportProgress(),
};
document.addEventListener('click',ev=>{let el=ev.target.closest('[data-action]');if(!el)return;let handler=actionHandlers[el.dataset.action];if(handler){ev.preventDefault();handler(el)}});
document.addEventListener('input',ev=>{let t=ev.target;if(t.id==='caseAnswer'){store.caseAnswers[ui.id]=t.value;persist();let counter=$('#wordCount');if(counter)counter.textContent=(t.value.trim()?t.value.trim().split(/\s+/).length:0)+' mots · sauvegarde locale'}if(t.dataset.exam){store.examAnswers[t.dataset.exam]=t.value;persist()}if(t.id==='globalSearch'){ui.query=t.value;ui.route='search';ui.id=null;window.location.hash='search';let cursor=t.selectionStart;render();let newEl=$('#globalSearch');newEl.focus();newEl.setSelectionRange(cursor,cursor)}if(['courseSearch','caseSearch','lexSearch'].includes(t.id)){ui.query=t.value;let focused=t.id,pos=t.selectionStart;render();let n=document.getElementById(focused);if(n){n.focus();n.setSelectionRange(pos,pos)}}if(t.id==='slideSearch'){ui.slideFilter=t.value;let pos=t.selectionStart;render();let n=$('#slideSearch');if(n){n.focus();n.setSelectionRange(pos,pos)}}});
document.addEventListener('change',ev=>{let t=ev.target;if(t.id==='courseGroup')ui.courseGroup=t.value;if(t.id==='courseSort')ui.sort=t.value;if(t.id==='caseLevel')ui.caseLevel=t.value;if(t.id==='caseTopic')ui.caseTopic=t.value;if(t.id==='cmpA')ui.cmpA=t.value;if(t.id==='cmpB')ui.cmpB=t.value;if(t.id==='flashTopic'){ui.flashTopic=t.value;ui.flashIndex=0;ui.flashReveal=false}if(t.hasAttribute('data-self')){let notes=new Set(store.caseNotes[ui.id]||[]),n=Number(t.dataset.self);if(t.checked)notes.add(n);else notes.delete(n);store.caseNotes[ui.id]=[...notes];persist();let c=DB.cases.find(x=>x.id===ui.id),p=Math.round(notes.size/c.checklist.length*100);if($('#selfScore'))$('#selfScore').textContent=p+' % des points cochés';if($('#selfBar'))$('#selfBar').style.width=p+'%';return}if(['courseGroup','courseSort','caseLevel','caseTopic','cmpA','cmpB','flashTopic'].includes(t.id))render()});
document.addEventListener('keydown',ev=>{let typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'');if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==='k'){ev.preventDefault();$('#globalSearch')?.focus();return}if(ui.route==='flash'&&!typing){if(ev.code==='Space'){ev.preventDefault();ui.flashReveal=!ui.flashReveal;render()}if(ev.key==='ArrowRight'){ev.preventDefault();actionHandlers.flashNext()}if(ev.key==='ArrowLeft'){ev.preventDefault();actionHandlers.flashPrev()}}if(ev.key==='Escape')$('#sidebar')?.classList.remove('open')});
window.addEventListener('hashchange',()=>{let [route,id]=location.hash.replace(/^#/,'').split('/');if(route&&(['dashboard','courses','lesson','cases','case','method','quiz','flash','exam','compare','lexicon','sources','search'].includes(route))&&(route!==ui.route||id!==ui.id)){ui.route=route;ui.id=id||null;render()}});
let [initialRoute,initialId]=location.hash.slice(1).split('/');if(initialRoute&&['dashboard','courses','lesson','cases','case','method','quiz','flash','exam','compare','lexicon','sources','search'].includes(initialRoute)){ui.route=initialRoute;ui.id=initialId||null}
render();
