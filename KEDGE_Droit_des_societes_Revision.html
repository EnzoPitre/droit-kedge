<script id="study-data" type="application/json">{"modules":[{"id":"fondations","group":"Fondamentaux","title":"Société, entreprise et classifications","subtitle":"Les notions qui conditionnent tout le reste","priority":3,"minutes":13,"lead":"Une société est une structure juridique ; une entreprise désigne une activité économique. Le contrat de société et la personnalité morale sont deux choses distinctes.","points":["La société repose sur l’article 1832 du Code civil : mise en commun, vocation au résultat et contribution aux pertes.","Une société n’acquiert en principe la personnalité morale qu’à l’immatriculation au RCS.","Identifier toujours la forme sociale avant d’appliquer une règle."],"sections":[{"h":"Société ≠ entreprise","p":"L’entreprise est une organisation de moyens de production. La société est un contrat d’organisation et, une fois immatriculée, une personne morale indépendante. Un entrepreneur individuel peut exploiter une entreprise sans créer de société.","items":[],"ex":"Deux amis exploitent une boutique : l’existence économique d’une activité ne prouve pas à elle seule l’existence d’une société.","trap":"","art":"C. civ., art. 1832 et 1842"},{"h":"Commerciales / civiles","p":"Certaines sociétés sont commerciales par leur forme, peu importe leur objet (SARL, SA, SAS, SNC, SCS, SCA). Les sociétés civiles suivent en principe un autre régime. Ne pas conclure qu’une activité civile impose automatiquement une société civile.","items":["La forme détermine notamment certains mécanismes de responsabilité.","Certaines sociétés de personnes impliquent une responsabilité indéfinie.","Les sociétés par actions facilitent la levée de capitaux."],"ex":"","trap":"","art":"C. civ., art. 1845 ; C. com., art. L.210-1"},{"h":"Personnes / capitaux ; fermées / ouvertes","p":"Dans une société de personnes, l’identité de l’associé compte beaucoup (intuitu personae). Dans une société de capitaux, l’investissement est central. La SARL est intermédiaire : responsabilité limitée mais cession à des tiers encadrée.","items":[],"ex":"","trap":"Une SAS n’est pas nécessairement « ouverte » : ses statuts peuvent prévoir agrément et inaliénabilité.","art":""},{"h":"Entrepreneur individuel depuis 2022","p":"La réforme de 2022 instaure en principe une séparation du patrimoine professionnel et personnel pour l’entrepreneur individuel, sous réserve des exceptions et renonciations légales.","items":[],"ex":"","trap":"Éviter le raccourci : seule une société protégerait le patrimoine personnel.","art":"Loi du 14 février 2022"}],"refs":["cours: slides 4–17","formes: p.1–2"]},{"id":"contrat","group":"Thème 1 · Contrat","title":"Les conditions du contrat de société","subtitle":"L’article 1832 et les conditions de validité","priority":3,"minutes":15,"lead":"Il faut cumuler les éléments propres à la société et les conditions du droit commun des contrats.","points":["Apports + participation aux résultats/pertes + affectio societatis.","Consentement libre, capacité et contenu licite/certain.","Une société unipersonnelle n’est admise que dans les cas prévus par la loi (EURL, SASU)."],"sections":[{"h":"Les trois éléments spécifiques","p":"L’article 1832 vise les apports et la vocation au résultat ; l’affectio societatis est un critère développé par la jurisprudence pour identifier la volonté d’agir ensemble.","items":["Apports : argent, biens, industrie.","Vocation : bénéfices/économies et contribution aux pertes.","Affectio : collaboration effective, intérêt commun et pied d’égalité juridique."],"ex":"","trap":"","art":"C. civ., art. 1832"},{"h":"Conditions du droit commun","p":"Le contrat doit résulter d’un consentement valable, conclu par des personnes capables et avoir un contenu licite et certain. Une erreur, un dol ou une violence appelle l’analyse du droit commun, mais la sanction contre la société est fortement restreinte.","items":["Consentement : absence de vice.","Capacité : attention au mineur, majeur protégé et à la qualité de commerçant en SNC.","Contenu : objet social licite et suffisamment déterminé."],"ex":"","trap":"Depuis 2025, ne pas affirmer que tout vice du consentement annule automatiquement la société : le régime spécial de nullité est beaucoup plus restrictif.","art":"C. civ., art. 1128 ; 1844-10 (2025)"},{"h":"Négociation, promesse et constitution","p":"Les pourparlers, lettres d’intention et promesses de société peuvent précéder la signature des statuts. Une promesse de négocier n’équivaut pas nécessairement à un engagement de constituer.","items":[],"ex":"Un courriel « on envisagera de créer une SAS » ne remplit pas forcément les conditions d’un contrat de société.","trap":"","art":""},{"h":"Société à un seul associé","p":"L’EURL est la SARL unipersonnelle ; la SASU est la SAS unipersonnelle. L’exception à l’exigence de pluralité des associés ne vaut pas pour toutes les formes sociales.","items":[],"ex":"","trap":"","art":"C. civ., art. 1832, al. 2"}],"refs":["cours: slides 19–23, 39, 44–49"]},{"id":"apports","group":"Thème 1 · Contrat","title":"Les apports et le capital social","subtitle":"Numéraire, nature, industrie ; souscription et libération","priority":3,"minutes":18,"lead":"L’apport fait entrer une valeur ou une prestation dans l’entreprise commune ; il ne doit pas être confondu avec un prêt à la société.","points":["Souscription = engagement ; libération = exécution.","L’apport en industrie ne forme pas le capital social.","Le capital social est un chiffre statutaire, pas la trésorerie disponible."],"sections":[{"h":"Apport en numéraire","p":"Versement d’une somme d’argent. La souscription constitue la promesse ; la libération est le versement effectif. Les règles de libération initiale varient selon la forme sociale.","items":["SARL/EURL : au moins 20 % de chaque apport en numéraire à la création ; solde en 5 ans.","SAS/SASU et SA : au moins 50 % à la constitution ; solde en 5 ans.","Pas de minimum légal de capital en SARL, SAS, SNC ; SA : 37 000 € (règle générale)."],"ex":"Pour une souscription en numéraire de 10 000 € en SARL, 2 000 € au moins sont libérés lors de la constitution.","trap":"","art":"C. com., art. L.223-7, L.225-3, L.227-1"},{"h":"Apport en nature","p":"Un bien autre qu’une somme d’argent : véhicule, logiciel, immeuble, brevet. L’évaluation est importante pour déterminer les droits et protéger associés/créanciers. Un commissaire aux apports peut être requis selon les cas.","items":["Apport en propriété : transfert de propriété.","Apport en jouissance : seule l’utilisation du bien est mise à disposition.","Surévaluation : responsabilité possible selon la forme et les circonstances."],"ex":"","trap":"Ne pas affirmer qu’un commissaire aux apports est toujours obligatoire : il existe des dispenses soumises à conditions.","art":"C. civ., art. 1843-3 ; C. com., art. L.223-9"},{"h":"Apport en industrie","p":"Mise à disposition de travail, compétences ou savoir-faire ; donne des droits sociaux sans entrer dans le capital social. Interdit en SA ; possible en SARL et SAS sous les règles applicables.","items":[],"ex":"Une associée développe le logiciel pour la société au titre d’un apport en industrie : elle peut recevoir des droits sans augmenter le capital.","trap":"","art":"C. civ., art. 1843-2"},{"h":"Capital, capitaux propres et trésorerie","p":"Capital social = montant nominal figurant dans les statuts. Capitaux propres = capital + réserves + résultat + autres composantes. Trésorerie = ressources liquides disponibles.","items":[],"ex":"","trap":"Une société peut avoir un capital élevé mais peu de liquidités. Ne pas confondre capital et patrimoine social.","art":""},{"h":"Compte courant d’associé : un autre rapport","p":"Une avance en compte courant est juridiquement un prêt consenti par un associé : il devient aussi créancier. Les modalités de remboursement peuvent être conventionnellement aménagées ou bloquées par accord.","items":[],"ex":"L’associé verse 15 000 € « remboursables » : analyser l’existence d’une créance de compte courant, pas d’un apport supplémentaire.","trap":"","art":"Cass. com., 24 juin 1997 (cours)"}],"refs":["cours: slides 22–32","formes: p.1","sarl: p.2","fin: p.1, 9, 29–30"]},{"id":"resultats","group":"Thème 1 · Contrat","title":"Bénéfices, pertes et clauses léonines","subtitle":"Le partage du risque social","priority":3,"minutes":12,"lead":"On peut répartir inégalement gains et pertes, mais pas tout confisquer ni exonérer totalement un associé.","points":["Art. 1844-1 : principe de répartition et prohibition des clauses léonines.","La clause léonine est réputée non écrite : distinguer l’anéantissement de la clause de celui de la société.","Une inégalité forte n’est pas automatiquement léonine : vérifier sa portée et sa durée."],"sections":[{"h":"Participation aux résultats","p":"La société poursuit un bénéfice ou une économie ; les associés contribuent aux pertes. Une répartition proportionnelle est la règle de principe, qui peut être aménagée.","items":[],"ex":"60 % de capital ne signifie pas nécessairement 60 % des dividendes si une répartition spéciale licite est prévue.","trap":"","art":"C. civ., art. 1832 et 1844-1"},{"h":"Les quatre clauses interdites","p":"Est réputée non écrite la stipulation qui accorde tous les profits à un associé, le prive totalement des profits, lui impute toutes les pertes ou l’exonère totalement des pertes.","items":[],"ex":"","trap":"« 90/10 » n’est pas automatiquement interdit ; « 100/0 » est un signal décisif, sous réserve de l’analyse de la stipulation.","art":"C. civ., art. 1844-1"},{"h":"Portée et temporalité","p":"Le cours distingue les clauses permanentes et certaines répartitions temporaires, renonciations à dividende après clôture ou promesses de rachat de titres. Examiner leur objet et leur effet réel.","items":["Une renonciation ponctuelle aux dividendes déjà acquis peut être admise.","Une promesse de rachat se distingue du pacte social suivant ses circonstances.","Toujours vérifier l’existence d’une exclusion totale et permanente du risque."],"ex":"","trap":"","art":"Cass. com., 13 févr. 1996 ; CE, 18 oct. 2022 (cours)"},{"h":"Contribution aux pertes ≠ paiement des dettes","p":"Contribution aux pertes = rapports entre associés ; obligation aux dettes = rapports avec les créanciers. La responsabilité envers les tiers dépend de la forme sociale.","items":[],"ex":"Un associé de SAS supporte économiquement la perte de sa mise, sans devoir en principe rembourser personnellement toutes les dettes sociales.","trap":"","art":""}],"refs":["cours: slides 33–38"]},{"id":"affectio","group":"Thème 1 · Contrat","title":"Affectio societatis et mésentente","subtitle":"Savoir reconnaître la société réelle","priority":3,"minutes":10,"lead":"L’affectio societatis exprime la volonté de collaborer sur un pied d’égalité et dans un intérêt commun.","points":["Critère jurisprudentiel utile pour les sociétés informelles.","La mésentente ne suffit pas : il faut une paralysie du fonctionnement social pour demander la dissolution pour justes motifs.","Ne pas exiger abusivement une preuve d’affectio à chaque acquisition de titres."],"sections":[{"h":"Définition jurisprudentielle","p":"Collaboration effective, active et intéressée à une entreprise commune, sur un pied d’égalité. Cette égalité renvoie à l’idée de volonté commune, non à l’identité des pouvoirs ou des apports.","items":[],"ex":"","trap":"","art":"Cass. com., 3 juin 1986 (cours)"},{"h":"Pourquoi la notion sert en cas pratique","p":"Pour qualifier une société créée de fait, détecter l’absence de véritable projet commun ou apprécier la crise du lien social.","items":[],"ex":"Deux concubins règlent des dépenses communes : cela ne suffit pas à prouver une société ; chercher aussi apport, résultats et volonté de collaborer.","trap":"","art":""},{"h":"Mésentente et dissolution","p":"La mésentente doit empêcher la société de fonctionner (blocage des décisions, paralysie durable). Un simple conflit personnel ne suffit pas.","items":[],"ex":"","trap":"","art":"C. civ., art. 1844-7, 5°"},{"h":"Acquisition ultérieure de titres","p":"Le cours souligne qu’un acquéreur de titres n’a pas à prouver distinctement son affectio societatis à chaque entrée dans une société déjà constituée.","items":[],"ex":"","trap":"","art":"Cass. com., 11 juin 2013 (cours)"}],"refs":["cours: slides 39–42, 75–76"]},{"id":"personnalite","group":"Thème 2 · Personne morale","title":"Personnalité morale et patrimoine","subtitle":"Naissance, capacité, autonomie et identité","priority":3,"minutes":16,"lead":"La société immatriculée devient titulaire de droits et d’obligations distincts de ceux de ses associés.","points":["RCS = point de départ de la personnalité morale des sociétés concernées.","RNE = registre national d’information / formalités ; il ne remplace pas partout l’immatriculation au RCS.","Une société et ses associés ne possèdent pas le même patrimoine."],"sections":[{"h":"Naissance de la personne morale","p":"La société acquiert la personnalité morale par l’immatriculation au RCS, sous réserve des sociétés auxquelles la loi réserve un autre régime. Le greffier contrôle les formalités.","items":[],"ex":"","trap":"","art":"C. civ., art. 1842 ; C. com., art. L.210-6"},{"h":"Capacité et patrimoine propre","p":"Elle peut contracter, posséder des biens, ester en justice, être créancière ou débitrice. Son patrimoine ne se confond pas avec celui des associés, dirigeants ou autres sociétés du groupe.","items":[],"ex":"Le propriétaire d’un immeuble est la SARL : un associé détenant 80 % des parts n’en est pas propriétaire à 80 %.","trap":"","art":""},{"h":"Identité et rattachement","p":"La dénomination sociale, le siège, l’objet, la forme, le capital et la durée sont des informations structurantes. La durée statutaire doit respecter la limite légale et peut être prorogée.","items":["Dénomination sociale ≠ marque commerciale.","Siège social : adresse de rattachement juridique.","Objet : activité envisagée, licite.","Durée : en principe 99 ans maximum."],"ex":"","trap":"","art":"C. civ., art. 1835 ; 1838 ; 1844-6"},{"h":"Responsabilité pénale","p":"Une personne morale peut être responsable d’infractions commises pour son compte par ses organes ou représentants ; la responsabilité des personnes physiques peut aussi être retenue.","items":[],"ex":"","trap":"","art":"C. pén., art. 121-2"},{"h":"Intérêt social et enjeux ESG","p":"L’article 1833 impose de gérer la société dans son intérêt social, en prenant en considération les enjeux sociaux et environnementaux de son activité. La raison d’être peut figurer dans les statuts.","items":[],"ex":"","trap":"","art":"C. civ., art. 1833 et 1835"}],"refs":["cours: slides 50–62"]},{"id":"rne","group":"Thème 2 · Personne morale","title":"RNE, RCS et formalités","subtitle":"Ne pas confondre publicité et acquisition de personnalité","priority":2,"minutes":9,"lead":"Le Registre national des entreprises, mis en place au 1er janvier 2023, centralise les informations et formalités. Le RCS conserve son rôle pour les sociétés commerciales.","points":["RNE : registre national dématérialisé couvrant les activités économiques.","RCS : immatriculation de la société commerciale et acquisition de personnalité morale.","Guichet unique : canal de dépôt de formalités."],"sections":[{"h":"Ce que le RNE change","p":"Unification d’informations et de formalités de création, modification, cessation. Il remplace notamment le répertoire des métiers et le registre des actifs agricoles, mais l’immatriculation au RCS reste requise pour les personnes concernées.","items":[],"ex":"","trap":"Dire « le RNE remplace le RCS » est faux. Le support de 2023 précise que les obligations RCS sont maintenues.","art":"C. com., art. L.123-36 s."},{"h":"Formalités en pratique","p":"Création : identité, forme, siège, capital, dirigeants, bénéficiaires effectifs selon règles applicables. Changements : déclarations, publicités et mise à jour. La voie de dépôt n’est pas le critère de naissance de la personnalité morale.","items":["Dépôt via guichet unique.","Traitement des formalités par organismes compétents.","Publication des informations selon les registres et exigences applicables."],"ex":"Une SAS a déposé ses données au guichet mais n’est pas immatriculée au RCS : ne pas présumer qu’elle est déjà une personne morale.","trap":"","art":""}],"refs":["rne: p.1–3","cours: slides 60–62"]},{"id":"formation","group":"Thème 2 · Personne morale","title":"Société en formation : reprise des actes","subtitle":"Le grand classique des études de cas","priority":3,"minutes":20,"lead":"Avant immatriculation, la société n’est pas encore une personne morale. Il faut identifier qui a signé et comment l’engagement peut être repris.","points":["Le signataire reste en principe engagé tant que l’acte n’a pas été régulièrement repris.","Trois mécanismes classiques : état annexé, mandat déterminé, décision postérieure.","Depuis le revirement de novembre 2023, le juge apprécie la commune intention de contracter pour la société en formation."],"sections":[{"h":"Question initiale : qui a agi ?","p":"La société en formation n’a pas la personnalité morale. Les personnes ayant agi pour elle répondent de leurs engagements, avec régime de solidarité différent selon la nature civile/commerciale.","items":[],"ex":"","trap":"","art":"C. civ., art. 1843 ; C. com., art. L.210-6"},{"h":"Une vraie période de formation","p":"Les fondateurs doivent avoir engagé un processus de constitution. Si l’activité est exercée durablement comme un groupement existant, une qualification de société créée de fait peut être envisagée.","items":[],"ex":"Le bail signé pour un futur restaurant est un acte préparatoire. Trois ans d’exploitation commune sans immatriculation appellent une autre qualification.","trap":"","art":""},{"h":"Les trois techniques de reprise","p":"1. État des actes conclus au nom et pour le compte de la société annexé aux statuts : reprise à l’immatriculation. 2. Mandat spécial avant immatriculation : actes déterminés repris à l’immatriculation. 3. Décision prise après immatriculation pour reprendre l’engagement.","items":["Vérifier le contenu et la précision de l’acte/mandat.","Vérifier l’immatriculation effective.","Vérifier la reprise : jamais présumer une reprise automatique de tous les actes."],"ex":"","trap":"","art":"C. com., art. R.210-5 à R.210-8 ; C. civ., art. 1843"},{"h":"Revirement jurisprudentiel de novembre 2023","p":"Le cours signale trois arrêts de la chambre commerciale du 29 novembre 2023 : les circonstances intrinsèques et extrinsèques permettent au juge de rechercher une intention commune de conclure pour la société, même si la formulation de l’acte est imparfaite.","items":[],"ex":"","trap":"Le revirement assouplit l’identification de l’acte pour la société en formation ; il ne dispense pas des conditions de reprise.","art":"Cass. com., 29 nov. 2023, n° 22-12.865, 22-21.623 et 22-18.295"},{"h":"Effets","p":"Si la reprise est valable, l’acte est réputé conclu dès l’origine par la société immatriculée. Sinon, les personnes engagées demeurent responsables. Le débiteur dépend de la reprise.","items":[],"ex":"Un fondateur signe un bail pour la future SAS ; si le bail figure dans un état annexé aux statuts et repris selon les règles, la SAS devient débitrice rétroactivement.","trap":"","art":""}],"refs":["cours: slides 63–70","reprise: p.1–4"]},{"id":"sanspm","group":"Thème 2 · Personne morale","title":"Société en participation et créée de fait","subtitle":"Les sociétés qui existent sans personnalité morale","priority":3,"minutes":13,"lead":"Un groupement peut être traité comme société sans qu’une personne morale nouvelle naisse : attention aux relations avec les tiers.","points":["Société en participation : choix des associés de ne pas immatriculer.","Société créée de fait : existence révélée par les comportements, constatée par le juge.","Les tiers et les associés n’ont pas forcément les mêmes exigences probatoires."],"sections":[{"h":"Société en participation","p":"Accord sociétaire sans immatriculation. Elle n’a ni personnalité morale ni patrimoine social autonome ; les relations internes sont en grande partie contractuelles.","items":[],"ex":"","trap":"","art":"C. civ., art. 1871 à 1872"},{"h":"Rapports avec les tiers","p":"En principe, chaque associé contracte en son nom et demeure seul engagé. En cas d’apparence, d’immixtion ou d’ostensibilité, d’autres associés peuvent aussi être exposés selon les critères légaux.","items":[],"ex":"","trap":"Ne pas dire : tous les associés sont automatiquement responsables de tous les actes.","art":"C. civ., art. 1872-1"},{"h":"Société créée de fait","p":"Le juge peut caractériser un groupement malgré l’absence de volonté formelle de constituer une société. Les trois éléments du contrat de société sont en principe recherchés.","items":[],"ex":"Deux personnes apportent fonds et travail, se partagent les revenus et gèrent conjointement une activité sans statuts.","trap":"","art":"C. civ., art. 1873"},{"h":"La preuve","p":"Rechercher des apports, une participation aux résultats et une réelle collaboration. Pour un tiers, la preuve de l’apparence du groupement peut jouer un rôle spécifique selon les circonstances.","items":[],"ex":"","trap":"","art":"Cass. 2e civ., 22 mai 2008 (cours)"}],"refs":["cours: slides 71–76"]},{"id":"nullites","group":"Thème 2 · Personne morale","title":"Nullités et sanctions · réforme 2025","subtitle":"Le point à maîtriser pour ne pas perdre des points","priority":3,"minutes":20,"lead":"La nullité de la société, la nullité d’un apport et la nullité d’une décision sociale sont désormais des questions distinctes ; le droit applicable a changé au 1er octobre 2025.","points":["Nullité de la société : causes drastiquement limitées depuis la réforme de 2025.","Nullité des décisions : cause légale + triple test (grief, influence, proportionnalité).","Régularisation, clause réputée non écrite, responsabilité et inopposabilité sont aussi des issues possibles."],"sections":[{"h":"Attention aux supports antérieurs à 2025","p":"Les diapositives 79–83 exposent les grands mécanismes et jurisprudences de leur époque. L’ordonnance du 12 mars 2025, entrée en vigueur le 1er octobre 2025, remanie les textes des nullités.","items":[],"ex":"","trap":"Ne pas reproduire mécaniquement en 2026 une ancienne formulation de l’article 1844-10.","art":"Ordonnance n° 2025-229 du 12 mars 2025"},{"h":"Nullité de la société — règle actuelle","p":"La nullité de la société ne peut résulter que de l’incapacité de tous les fondateurs ou de la violation des dispositions fixant un nombre minimal de deux associés.","items":[],"ex":"Un dol allégué entre fondateurs ne suffit pas, par lui-même, à prononcer la nullité de la personne morale selon le régime actuel.","trap":"","art":"C. civ., art. 1844-10 (depuis 01.10.2025)"},{"h":"Nullité de l’apport — règle actuelle","p":"Un article 1844-10-1 encadre les nullités d’apport, l’annulation des titres correspondants et les restitutions ; si tous les apports sont annulés, le texte prévoit la dissolution.","items":[],"ex":"","trap":"","art":"C. civ., art. 1844-10-1 (depuis 01.10.2025)"},{"h":"Nullité d’une décision — cause + triple test","p":"La décision doit relever d’une cause de nullité admise. Depuis octobre 2025, l’article 1844-12-1 exige cumulativement un grief lié à l’intérêt protégé, une influence de l’irrégularité sur le sens de la décision et des conséquences non excessives pour l’intérêt social.","items":["1. Cause de nullité légalement admissible ?","2. Le demandeur subit-il un grief ?","3. L’irrégularité a-t-elle influencé le sens de la décision ?","4. La nullité serait-elle proportionnée au regard de l’intérêt social ?"],"ex":"","trap":"Une violation des statuts n’est pas en principe une cause de nullité, sauf si la loi en dispose autrement.","art":"C. civ., art. 1844-10 et 1844-12-1"},{"h":"Régularisation et sanctions alternatives","p":"L’action en nullité s’éteint lorsque sa cause a cessé d’exister le jour où le tribunal statue au fond en première instance. La réforme de 2025 a retiré l’ancienne exception relative à l’illicéité de l’objet social dans l’article 1844-11.","items":["Clause réputée non écrite : seule la stipulation disparaît.","Responsabilité civile : réparation d’un préjudice.","Inopposabilité : la règle ne peut pas être opposée à certains tiers.","Régularisation : corriger l’irrégularité avant jugement dans les conditions légales."],"ex":"","trap":"","art":"C. civ., art. 1844-11 ; 1844-16"}],"refs":["cours: slides 77–83 (attention : antérieurs à la réforme)","legifrance: art. 1844-10, 1844-10-1, 1844-11, 1844-12-1"]},{"id":"formes","group":"Formes & gouvernance","title":"Comparer SNC, SARL, SAS, SA, SCS et SCA","subtitle":"Capital, associés, titres, responsabilité et direction","priority":3,"minutes":18,"lead":"Le premier réflexe : vérifier la forme sociale, car une solution valable en SAS peut être fausse en SNC ou SA.","points":["SNC : responsabilité indéfinie et solidaire des associés.","SARL / SAS / SA : associés en principe limités au montant de leurs apports.","Le capital minimum général de la SA est de 37 000 €."],"sections":[{"h":"SNC : intuitu personae et risque","p":"Au moins deux associés, ayant la qualité de commerçants ; aucune exigence générale de capital minimum ; parts sociales ; responsabilité indéfinie et solidaire des dettes sociales.","items":[],"ex":"","trap":"Un associé de SNC ne bénéficie pas du même bouclier qu’un actionnaire de SAS.","art":""},{"h":"SARL / EURL","p":"SARL : 2 à 100 associés, parts sociales, gérance confiée à une ou plusieurs personnes physiques ; EURL : associé unique. Responsabilité des associés en principe limitée aux apports.","items":["Cession à un tiers : procédure d’agrément légale.","Capital librement fixé (pas de minimum général).","Gérant majoritaire et gérant minoritaire : régimes sociaux distincts (selon situation)."],"ex":"","trap":"","art":"C. com., art. L.223-1 s."},{"h":"SAS / SASU","p":"Grande liberté d’organisation par les statuts, président obligatoire, actions. SAS : deux associés ou plus ; SASU : associé unique. La responsabilité des associés est en principe limitée aux apports.","items":[],"ex":"","trap":"Souplesse statutaire ≠ absence de règles impératives, notamment pour les décisions collectives et la représentation.","art":"C. com., art. L.227-1 s."},{"h":"SA","p":"Capital minimum général de 37 000 €, actions, structures de direction définies par la loi ; en principe 2 actionnaires minimum, au moins 7 si admise aux négociations sur un marché réglementé.","items":["Modèle moniste : conseil d’administration + direction générale.","Modèle dualiste : directoire + conseil de surveillance."],"ex":"","trap":"","art":"C. com., art. L.225-1 s."},{"h":"SCS / SCA","p":"Commandités : responsabilité indéfinie et solidaire ; commanditaires : responsabilité limitée aux apports. SCS : parts sociales ; SCA : actions pour commanditaires, capital minimum général 37 000 €.","items":[],"ex":"","trap":"Ne pas confondre commandité (risque fort) et commanditaire (apporteur de capitaux).","art":""}],"refs":["formes: p.1–8","sarl: p.1–7","cours: slides 10–15"]},{"id":"sarl_sas","group":"Formes & gouvernance","title":"SARL vs SAS : choix et cession des titres","subtitle":"Points concrets d’une étude de cas de création","priority":3,"minutes":13,"lead":"La SARL est encadrée par la loi ; la SAS offre un fonctionnement statutaire très flexible, qui impose de bien lire les clauses.","points":["SARL = parts sociales ; SAS = actions.","SARL : agrément légal des tiers ; SAS : restrictions et agrément pouvant être stipulés dans les statuts.","En SAS, la liberté statutaire n’efface pas l’obligation d’avoir un président."],"sections":[{"h":"Cession SARL","p":"La cession de parts sociales à un tiers étranger à la société requiert en principe l’agrément légal. La loi et les statuts fixent la procédure et les hypothèses d’extension.","items":[],"ex":"","trap":"","art":"C. com., art. L.223-14"},{"h":"Cession SAS","p":"Les actions sont en principe cessibles, mais les statuts peuvent prévoir agrément, préemption, inaliénabilité dans les limites légales et exclusion selon conditions.","items":[],"ex":"Une SAS peut imposer un agrément statutaire à la cession à un investisseur : lire les statuts avant de conclure.","trap":"","art":"C. com., art. L.227-13 à L.227-19"},{"h":"Direction","p":"En SARL, une ou plusieurs personnes physiques sont gérantes. En SAS, un président représente la société ; des directeurs généraux et organes complémentaires peuvent exister si prévus.","items":[],"ex":"","trap":"","art":"C. com., art. L.223-18 ; L.227-6"},{"h":"Choix de forme en situation","p":"Analyser le nombre d’associés, le besoin de levée de fonds, les transferts de titres, le niveau de contrôle souhaité, le capital, la gouvernance et le risque.","items":[],"ex":"","trap":"Ne pas prétendre qu’une SAS est toujours « meilleure » : elle est plus souple, mais une rédaction insuffisante des statuts peut générer des conflits.","art":""}],"refs":["sarl: p.1–7","formes: p.1–8","parts: p.1–4"]},{"id":"sa","group":"Formes & gouvernance","title":"Gouvernance de la société anonyme","subtitle":"Conseil d’administration ou directoire","priority":2,"minutes":16,"lead":"La SA propose deux architectures légales. Le dirigeant n’a pas automatiquement les mêmes pouvoirs ou modalités de révocation selon le poste.","points":["Moniste : conseil d’administration et directeur général.","Dualiste : directoire pour diriger, conseil de surveillance pour contrôler.","Le conseil d’administration comprend en principe 3 à 18 administrateurs."],"sections":[{"h":"Modèle moniste","p":"Le conseil d’administration définit les orientations et contrôle la direction. Le directeur général dirige et représente la société. La présidence du conseil peut être cumulée avec la direction générale (PDG) ou dissociée.","items":[],"ex":"","trap":"","art":"C. com., art. L.225-17 s."},{"h":"Conseil d’administration","p":"En principe 3 à 18 administrateurs, personnes physiques ou morales selon règles. Nomination et révocation obéissent à des règles légales ; attention aux limites d’âge, durée et cumul de mandats.","items":["L’assemblée désigne normalement les administrateurs.","Ils sont généralement révocables ad nutum.","Le conseil choisit son président parmi ses membres."],"ex":"","trap":"","art":"C. com., art. L.225-17 s."},{"h":"Directeur général","p":"Il a des prérogatives de direction et de représentation. Sa révocation et ses éventuelles indemnités s’analysent suivant sa situation et les textes ; ne pas assimiler automatiquement au régime des administrateurs.","items":[],"ex":"","trap":"","art":"C. com., art. L.225-51-1 à L.225-56"},{"h":"Modèle dualiste","p":"Le directoire assure la direction ; le conseil de surveillance contrôle la gestion. La séparation institutionnelle évite le cumul des fonctions de direction et de surveillance.","items":[],"ex":"","trap":"","art":"C. com., art. L.225-57 s."},{"h":"Responsabilité des dirigeants","p":"Des infractions à la loi, violations des statuts ou fautes de gestion peuvent engager la responsabilité civile des organes selon leurs fonctions, préjudice et causalité.","items":[],"ex":"","trap":"","art":"C. com., art. L.225-251"}],"refs":["gouv: p.1–6"]},{"id":"cession","group":"Formes & gouvernance","title":"Actions, parts sociales et droits des associés","subtitle":"Titre, circulation et droits préférentiels","priority":2,"minutes":12,"lead":"Les titres représentent les droits des associés dans le capital ; ils ne se transmettent pas de façon identique selon les structures.","points":["Actions : sociétés par actions (SA, SAS, SCA).","Parts sociales : SARL, SNC, SCS et sociétés civiles.","Une action peut conférer des droits particuliers selon les conditions légales et statutaires."],"sections":[{"h":"Nature des titres","p":"Une action est un titre de capital dans une société par actions ; une part sociale caractérise de nombreuses autres sociétés. Les titres donnent des droits financiers et politiques selon leur régime.","items":[],"ex":"","trap":"","art":"C. com., art. L.228-1 s."},{"h":"Droits politiques et financiers","p":"Information, vote, participation aux dividendes éventuels et au boni de liquidation. Les actions de préférence peuvent aménager certains droits dans les limites légales.","items":["Droit aux bénéfices ≠ dividende automatique.","Droit de vote parfois aménagé selon la catégorie d’actions.","La cession peut être soumise à des restrictions."],"ex":"","trap":"","art":""},{"h":"Transmissibilité et fiscalité","p":"En général, une cession d’actions est plus facile que celle de parts de SARL à un tiers. Les supports présentent des taux fiscaux usuels historiques (0,1 % actions ; 3 % parts après abattement ; 5 % prépondérance immobilière), à vérifier avec les textes fiscaux à la date du cas.","items":[],"ex":"","trap":"Les taux et exceptions fiscaux peuvent évoluer : ne pas les appliquer sans vérifier la nature de l’opération et le régime actuel.","art":""}],"refs":["parts: p.1–4","fin: p.1–8"]},{"id":"capital","group":"Financement","title":"Augmentation du capital et dilution","subtitle":"Numéraire, nature, incorporation de réserves","priority":2,"minutes":15,"lead":"Une augmentation de capital accroît le capital statutaire, mais ne crée pas toujours une nouvelle trésorerie.","points":["Création de nouveaux titres ou augmentation de leur nominal.","Augmentation par incorporation de réserves : pas d’arrivée d’argent frais.","Le droit préférentiel de souscription peut limiter la dilution des actionnaires existants."],"sections":[{"h":"Trois mécanismes","p":"Apports de nouvelles sommes, apports de biens ou incorporation de réserves / primes / bénéfices suivant les règles applicables.","items":[],"ex":"Incorporer 20 000 € de réserves augmente le capital affiché mais ne verse pas 20 000 € sur le compte bancaire.","trap":"","art":""},{"h":"Émissions, prime d’émission, DPS","p":"Des titres nouveaux peuvent diluer la participation des associés. En SA, le droit préférentiel de souscription peut permettre aux titulaires de souscrire en priorité ; la prime d’émission tient compte de la valeur réelle de la société.","items":[],"ex":"100 actions existantes puis émission de 50 actions à un investisseur : sans souscription, l’associé à 40 actions passe de 40 % à 26,67 %.","trap":"","art":""},{"h":"Décision et protection de l’associé","p":"Les majorités et quorums dépendent de la forme et de la date/structure des statuts. Une augmentation du nominal impliquant un engagement accru peut demander l’accord des associés concernés, voire l’unanimité selon l’opération.","items":[],"ex":"","trap":"Ne transposer pas automatiquement les seuils d’AGE de SA à une SAS.","art":"C. civ., art. 1836 ; C. com., art. L.225-129 s."},{"h":"Perte de la moitié des capitaux propres","p":"Lorsque les capitaux propres deviennent inférieurs à la moitié du capital, des mécanismes particuliers de consultation et régularisation s’appliquent à certaines formes sociales.","items":[],"ex":"","trap":"","art":"C. com., art. L.223-42 ; L.225-248"}],"refs":["fin: p.9–19","cours: slides 25–27"]},{"id":"obligations","group":"Financement","title":"Obligations : financer par la dette","subtitle":"Nominal, coupons, échéance, masse des obligataires","priority":2,"minutes":16,"lead":"L’obligataire est un créancier et non un associé : il reçoit une créance de remboursement, pas des droits de vote d’actionnaire.","points":["Action = capital et risque d’associé ; obligation = dette de l’émetteur.","Coupon = intérêt périodique ; maturité = échéance du titre.","Les OCA/OBSA mêlent dette et accès potentiel au capital."],"sections":[{"h":"Terminologie indispensable","p":"Nominal : montant de référence de la créance. Prix d’émission : prix payé initialement. Coupon : intérêt prévu. Maturité : date d’échéance. Prix de remboursement : montant remboursé.","items":["Sous le pair : prix < nominal.","Au-dessus du pair : prix > nominal.","Prime de remboursement : montant remboursé > nominal."],"ex":"","trap":"","art":""},{"h":"Actionnaire vs obligataire","p":"L’actionnaire est associé et participe au risque des résultats. L’obligataire est créancier : le paiement contractuel des intérêts ne dépend pas, en principe, de la distribution de dividendes ; il reste exposé au risque de défaut.","items":[],"ex":"","trap":"Ne pas dire qu’une obligation garantit à 100 % le remboursement : l’émetteur peut faire défaut.","art":""},{"h":"Émission et gouvernance","p":"Le cours présente les règles de création d’émissions, l’information des investisseurs et la masse des obligataires. Les représentants de la masse défendent l’intérêt collectif des créanciers, sans gérer la société.","items":[],"ex":"","trap":"","art":"C. com., art. L.228-38 s."},{"h":"Titres hybrides","p":"OCA : obligation convertible en actions ; OBSA : obligation assortie de bons de souscription d’actions. Analyser quand et comment les titres donnent accès au capital.","items":[],"ex":"Si une obligation se convertit en actions, son titulaire peut devenir associé selon les modalités du titre.","trap":"","art":""}],"refs":["oblig: p.1–4","fin: p.18–21, 28–29"]},{"id":"financement","group":"Financement","title":"Crédit, cession Dailly, affacturage","subtitle":"Les mécanismes du financement par dette","priority":1,"minutes":15,"lead":"Dans un cas de financement, qualifier le contrat et identifier le porteur du risque d’impayé.","points":["Prêt bancaire : financement contre remboursement et intérêts.","Crédit-bail : location avec option d’achat éventuelle.","Cession Dailly et affacturage : mobilisation de créances, aux garanties et recours différents selon contrat."],"sections":[{"h":"Crédit bancaire et crédit-bail","p":"Le prêt mobilise du capital remboursable. Le crédit-bail permet d’utiliser un bien loué, souvent avec faculté d’achat à l’issue du contrat ; les coûts et effets comptables dépendent du cas.","items":[],"ex":"Une entreprise veut une machine pour 5 ans : comparer acquisition financée par prêt et location avec option d’achat.","trap":"","art":""},{"h":"Dailly","p":"Cession ou nantissement de créances professionnelles au profit d’un établissement de crédit, notamment pour financer la trésorerie. Le bordereau et l’identité des créances sont essentiels.","items":[],"ex":"","trap":"Le mécanisme n’efface pas automatiquement tout recours de la banque contre le cédant en cas d’impayé.","art":"C. mon. fin., art. L.313-23 s."},{"h":"Affacturage","p":"Un factor peut gérer, financer et éventuellement garantir le recouvrement de créances commerciales. L’étendue de la garantie dépend de l’offre et de la convention.","items":[],"ex":"Une facture de 25 000 € est cédée au factor pour financer immédiatement l’activité : étudier frais et garantie d’impayé.","trap":"","art":""},{"h":"Effets de commerce","p":"Lettre de change : le tireur donne ordre au tiré de payer le porteur à l’échéance. Billet à ordre : le souscripteur promet lui-même de payer le bénéficiaire. L’escompte permet une avance de fonds.","items":[],"ex":"","trap":"","art":"C. com., art. L.511-1 s. ; L.512-1 s."},{"h":"Compte courant bloqué","p":"Le compte courant d’associé est une dette financière envers l’associé ; une convention de blocage peut stabiliser ce financement à la demande d’un banquier.","items":[],"ex":"","trap":"","art":"C. civ., art. 1836, al. 2"}],"refs":["fin: p.22–31"]},{"id":"caution","group":"Financement","title":"Cautionnement des dettes sociales","subtitle":"Pourquoi la responsabilité limitée ne suffit pas toujours","priority":3,"minutes":18,"lead":"Un dirigeant ou associé d’une société à responsabilité limitée peut s’engager personnellement comme caution du prêt social.","points":["Pour une dette commerciale garantie après 01.01.2022, le cautionnement est commercial par la forme.","Vérifier l’existence du cautionnement et ses exigences protectrices.","La limite de responsabilité de l’associé n’efface pas son engagement autonome de caution."],"sections":[{"h":"Qualification du cautionnement","p":"La caution s’engage envers le créancier à payer si le débiteur principal fait défaut. Depuis la réforme de 2022, le cautionnement d’une dette commerciale constitue un acte de commerce, indépendamment d’un intérêt patrimonial personnel.","items":[],"ex":"","trap":"","art":"C. com., art. L.110-1, 11°"},{"h":"Antérieur / postérieur au 1er janvier 2022","p":"Pour un cautionnement ancien, la jurisprudence retenait notamment l’intérêt personnel patrimonial de la caution ; les contrats conclus depuis 2022 suivent les nouveaux textes.","items":[],"ex":"","trap":"Toujours vérifier la date du cautionnement avant d’appliquer la réforme du droit des sûretés.","art":""},{"h":"Protections de la caution personne physique","p":"Selon les conditions légales, la validité et l’efficacité du cautionnement peuvent dépendre d’une mention apposée par la caution, de la proportionnalité de son engagement et d’une obligation de mise en garde.","items":["La caution est-elle une personne physique ?","Qui est le créancier (professionnel) ?","Montant garanti et étendue.","Disproportion manifeste et conséquences éventuelles.","Information et mise en garde : conditions du texte."],"ex":"","trap":"","art":"C. civ., art. 2297, 2300 et 2299"},{"h":"Défaut du débiteur","p":"La banque peut rechercher la caution conformément aux règles applicables et à l’acte. Distinction entre l’obligation de la société et l’obligation personnelle de la caution.","items":[],"ex":"Le président d’une SAS signe « caution personnelle » pour un emprunt de 80 000 € : son patrimoine peut être engagé malgré la limitation des risques de l’actionnaire.","trap":"","art":""}],"refs":["caution: p.1–5"]},{"id":"transformation","group":"Opérations","title":"Transformer une SA en SAS","subtitle":"Règles, unanimité, publicité et continuité","priority":3,"minutes":14,"lead":"Une transformation régulière change de forme sociale, pas de personne morale. La décision d’une SA en SAS appelle l’unanimité.","points":["La transformation en SAS est prise à l’unanimité des associés.","La continuité de la personne morale est conservée en cas de transformation régulière.","Vérifier conditions, rapports, consultation éventuelle et formalités de publicité."],"sections":[{"h":"Conditions et procédure","p":"Le support de 2023 expose une SA justifiant de deux ans d’existence et de l’approbation des deux premiers bilans ; la transformation appelle la vérification des conditions de la SAS, des rapports d’évaluation et des consultations requises.","items":[],"ex":"","trap":"Les exigences de commissaire à la transformation / CAC dépendent de la configuration exacte et des textes applicables à la date de l’opération.","art":"C. com., art. L.225-243 ; L.224-3"},{"h":"Unanimité","p":"La décision de transformation en SAS requiert l’accord unanime des associés. Une majorité de 80 ou 90 % ne suffit pas.","items":[],"ex":"Onze actionnaires votent oui, un vote non : la transformation ne peut pas être adoptée par une simple majorité.","trap":"","art":"C. com., art. L.227-3"},{"h":"Effet de continuité","p":"La transformation régulière n’entraîne pas création d’une personne morale nouvelle : patrimoine, contrats et personnalité se poursuivent.","items":[],"ex":"","trap":"","art":"C. civ., art. 1844-3"},{"h":"Formalités et information","p":"Décision collective, mise à jour des statuts, désignation des organes, publication et déclaration via les circuits actuels. Le support de 2023 cite encore un ancien formulaire M2 : se référer aux formalités actuelles via le guichet unique.","items":[],"ex":"","trap":"Ne pas conserver un formulaire administratif historique comme formalité universelle en 2026.","art":""}],"refs":["transfo: p.1–4"]},{"id":"methodofond","group":"Examen","title":"Les 7 questions réflexes du professeur","subtitle":"Checklist générale du cas pratique","priority":3,"minutes":10,"lead":"Ton diaporama se termine par une grille de lecture : qualification, formes, personnalité, auteur de l’acte, irrégularité et sanction.","points":["1. Contrat de société ? 2. Trois éléments ? 3. Forme ? 4. Personnalité ?","5. Auteur de l’acte ? 6. Irrégularité ? 7. Sanction exacte ?","Toujours conclure en tenant compte des faits manquants."],"sections":[{"h":"D’abord qualifier, ensuite appliquer","p":"Les faits n’ont d’intérêt juridique que s’ils permettent de répondre à une question. Distinguer situation certaine et éléments insuffisants.","items":[],"ex":"« Hugo et Inès exploitent une boutique » → ne présumez pas qu’une SAS existe ; demandez statuts et immatriculation.","trap":"","art":""},{"h":"La bonne sanction","p":"Rester précis : nullité de la société, de la décision ou de l’apport ; clause réputée non écrite ; inopposabilité ; responsabilité ; dissolution ; reprise des actes ; régularisation.","items":[],"ex":"","trap":"Éviter « c’est illégal donc la société est nulle » : c’est rarement une conclusion correcte.","art":""},{"h":"Rédaction attendue","p":"La réponse doit articuler faits → règle → application → conclusion, idéalement par problème de droit. La méthode complète et un exemple de copie sont accessibles dans « Méthodologie ».","items":[],"ex":"","trap":"","art":""}],"refs":["cours: slides 84–86"]}],"cases":[{"id":"c1","title":"La startup entre amis","topic":"contrat","level":"Débutant","minutes":12,"facts":"Léa apporte 12 000 €, Yanis met à disposition ses compétences de développeur et Chloé fournit du matériel. Ils travaillent ensemble à une application, se partagent les recettes et assument les pertes. Aucun statut n’a encore été rédigé. Un client affirme qu’il existe déjà une société et réclame paiement à « la société ».","questions":"Les éléments d’un contrat de société sont-ils réunis ? Existe-t-il une personne morale ? Qui pourrait être engagé ?","issues":["Contrat de société ou simple collaboration ?","Personnalité morale sans immatriculation ?","Engagement des personnes envers le client ?"],"rules":["Art. 1832 : apports, vocation au résultat et affectio societatis.","Art. 1842 : personnalité morale liée à l’immatriculation ; analyse éventuelle d’une société créée de fait (art. 1873)."],"application":["Léa apporte des fonds, Yanis son industrie, Chloé du matériel ; les recettes et pertes sont partagées. La coopération révèle un projet commun. Aucun RCS n’est mentionné : pas de personne morale.","Selon les conditions d’apparence et la façon de contracter, les personnes physiques peuvent être recherchées ; il faut identifier qui a signé et ce que savait le client."],"conclusion":["Les indices du contrat de société sont forts, mais la personne morale n’est pas née. Une société créée de fait peut être discutée ; la responsabilité du contrat exige une analyse des actes et de l’apparence."],"checklist":["apports","résultats","affectio","immatriculation","engagement"],"trap":"Ne pas dire que l’activité commune suffit à prouver l’immatriculation."},{"id":"c2","title":"Le dividende à 100 %","topic":"resultats","level":"Débutant","minutes":10,"facts":"Les statuts d’une SARL attribuent 100 % de tous les bénéfices futurs à Paul, détenteur de 40 % des parts. Ses deux associés ne recevront jamais aucun bénéfice, mais participeront aux pertes. Paul affirme que la liberté statutaire rend la clause incontestable.","questions":"La clause est-elle licite ? Quelle sanction ?","issues":["Qualification de clause léonine","Différence répartition inégale / exclusion totale","Sanction de la stipulation"],"rules":["Art. 1844-1 C. civ. : est réputée non écrite la stipulation attribuant tout profit à un associé ou excluant totalement un autre du profit."],"application":["La répartition n’est pas simplement inégale : Paul reçoit toujours 100 % et les autres 0 %. L’exclusion totale est écrite dans les statuts."],"conclusion":["Clause léonine réputée non écrite ; la société n’est pas automatiquement annulée. Les résultats devront être répartis selon les règles applicables en l’absence de clause."],"checklist":["article 1844-1","100 %","exclusion totale","réputée non écrite"],"trap":"Confondre clause nulle et société nulle."},{"id":"c3","title":"Une clause à 90 % pour un an","topic":"resultats","level":"Intermédiaire","minutes":14,"facts":"Une SAS prévoit que pendant sa première année, l’investisseur A percevra 90 % des bénéfices distribuables et les deux fondateurs 10 % au total ; ensuite la répartition redevient proportionnelle aux titres. Un fondateur affirme que toute disparité supérieure à 50 % est interdite.","questions":"La clause est-elle automatiquement léonine ? Quels faits faut-il examiner ?","issues":["Différence inégalité / exclusion totale","Portée temporelle","Contexte de la clause"],"rules":["Art. 1844-1 permet des répartitions inégales sauf suppression totale du bénéfice ou des pertes. Le cours insiste sur la portée et la durée des clauses."],"application":["A ne reçoit pas 100 %, les fondateurs ne sont pas privés de tout profit et la stipulation est temporaire. D’autres dispositions ou la réalité de son fonctionnement doivent être vérifiées."],"conclusion":["Pas de clause léonine caractérisée par le seul chiffre de 90 %. L’analyse des droits effectivement supprimés et de la temporalité reste nécessaire."],"checklist":["1844-1","inégalité licite","exclusion totale","durée"],"trap":"Ne pas inventer un seuil de 50 %."},{"id":"c4","title":"Le bail signé avant l’immatriculation","topic":"formation","level":"Intermédiaire","minutes":18,"facts":"Le 4 février, Emma signe personnellement un bail « pour le compte de la SAS Lumière en formation ». Les statuts signés le 15 février comportent en annexe l’état exact des engagements, dont ce bail. La SAS est immatriculée le 1er mars. Le bailleur réclame les loyers de juin directement à Emma.","questions":"Qui est débiteur des loyers ? Quelles conditions justifient cette réponse ?","issues":["Acte en formation","État des actes et reprise","Effet rétroactif"],"rules":["C. com., art. L.210-6 ; R.210-5 s. : engagement des signataires avant immatriculation ; possibilité de reprise. L’état annexé aux statuts permet la reprise lors de l’immatriculation sous conditions."],"application":["Le bail a été conclu pour la SAS en formation ; l’état annexé identifie précisément l’acte et l’immatriculation est intervenue. La technique classique de reprise est réunie dans les faits."],"conclusion":["La SAS est en principe réputée avoir contracté le bail dès l’origine ; les loyers repris sont dus par elle. Vérifier toute condition complémentaire contenue dans le contrat."],"checklist":["formation","état annexé","immatriculation","reprise","effet rétroactif"],"trap":"La simple création de la société ne reprend pas tous les engagements indistinctement."},{"id":"c5","title":"La commande oubliée","topic":"formation","level":"Intermédiaire","minutes":18,"facts":"Nora achète 18 000 € de matériel au nom de sa future SARL, en indiquant au vendeur que la société est en création. L’acte n’est annexé à aucun état, aucun mandat spécial n’a été donné, et l’assemblée ne décide rien après l’immatriculation. La SARL utilise ensuite le matériel. Nora estime que l’utilisation suffit à transférer la dette.","questions":"La SARL est-elle devenue débitrice ?","issues":["Existence d’un acte de formation","Modes de reprise","Usage matériel et reprise juridique"],"rules":["C. civ., art. 1843 ; C. com., art. R.210-5 s. : reprise dans les formes prescrites, à défaut responsabilité de ceux qui ont agi."],"application":["L’acte est clairement préparatoire mais aucune des trois voies de reprise n’est décrite. L’usage du matériel ne remplace pas, à lui seul, la décision ou le mécanisme légal de reprise."],"conclusion":["Nora demeure en principe personnellement engagée envers le vendeur, sous réserve d’un autre fondement contractuel établi. Conseiller une régularisation adaptée."],"checklist":["absence de reprise","personne qui agit","R210-5","usage ≠ reprise"],"trap":"Ne pas présumer une reprise tacite automatique du seul usage du matériel."},{"id":"c6","title":"Le contrat au mauvais intitulé","topic":"formation","level":"Avancé","minutes":22,"facts":"Deux fondateurs négocient un bail pour l’ouverture d’une SAS. Le document comporte en tête « SAS Nova », alors non immatriculée, mais plusieurs échanges montrent que le bailleur et les fondateurs avaient entendu engager la future SAS. Après immatriculation, les associés votent la reprise du bail. Le bailleur invoque l’absence de formule « pour le compte de la société en formation » pour refuser.","questions":"Quelle portée donner à la formulation imparfaite et à la décision de reprise ?","issues":["Intentions des parties","Revirement novembre 2023","Formalités de reprise distinctes"],"rules":["Cass. com., 29 nov. 2023 (3 arrêts du cours) : appréciation de l’intention commune au vu des circonstances intrinsèques et extrinsèques.","Règles légales de reprise des actes toujours applicables."],"application":["Le libellé n’est pas idéal mais les échanges tendent à démontrer l’intention de contracter pour la future société. Une décision de reprise est mentionnée, dont il faut contrôler la validité et l’objet."],"conclusion":["Le seul défaut de formule ne suffit plus à trancher mécaniquement. Si l’intention et les conditions de reprise sont établies, le bail peut être valablement repris."],"checklist":["29 novembre 2023","intention commune","circonstances","reprise"],"trap":"L’assouplissement de rédaction ne remplace pas l’exigence d’une reprise valide."},{"id":"c7","title":"Deux concubins et un food truck","topic":"sanspm","level":"Intermédiaire","minutes":20,"facts":"Camille et Samir achètent un food truck grâce à des fonds communs, travaillent chaque week-end, se répartissent les recettes après paiement des dépenses et décident ensemble des investissements. Aucun acte constitutif n’a été signé. Un fournisseur impayé veut les poursuivre tous les deux.","questions":"Une société créée de fait est-elle caractérisée ? Qui peut être tenu envers le fournisseur ?","issues":["Trois éléments sociétaires","Création de fait","Opposabilité et dette envers tiers"],"rules":["Art. 1832 et 1873 C. civ. : apports, participation aux résultats et affectio ; société créée de fait. Art. 1872-1 : engagements envers tiers selon actes et comportement."],"application":["Biens et fonds apportés ; recettes réparties ; décision conjointe : les trois indices sont présents. Pour la dette du fournisseur, établir qui a contracté et l’éventuelle apparence ou immixtion."],"conclusion":["La qualification de société créée de fait est sérieusement défendable. La dette envers le fournisseur n’est pas automatiquement imputable aux deux sans examiner leurs actes."],"checklist":["apports","résultats","affectio","tiers","1872-1"],"trap":"Vie commune et mise en commun de dépenses domestiques ne suffisent pas à elles seules."},{"id":"c8","title":"La mauvaise personne poursuivie","topic":"personnalite","level":"Débutant","minutes":12,"facts":"La SARL Atelier Bleu est immatriculée et loue un immeuble au nom de la société. Le propriétaire veut demander personnellement les loyers impayés à Julie, associée majoritaire détenant 80 % du capital, au motif qu’elle « possède presque toute la société ». Julie n’a signé aucune caution.","questions":"Julie est-elle automatiquement débitrice ?","issues":["Personnalité morale","Autonomie patrimoniale","Responsabilité limitée et exceptions"],"rules":["C. civ., art. 1842 ; SARL : responsabilité en principe limitée aux apports (C. com., art. L.223-1)."],"application":["La SARL est une personne morale distincte ; l’immeuble et le bail sont au nom de la société. Aucun engagement personnel de Julie n’est indiqué."],"conclusion":["Julie n’est pas personnellement tenue des loyers du seul fait de ses 80 %. Examiner seulement une éventuelle faute, caution ou autre fondement distinct s’il apparaît."],"checklist":["SARL","personnalité","patrimoine","limitation","caution"],"trap":"Ne pas confondre actionnaire majoritaire et débiteur de la dette sociale."},{"id":"c9","title":"Le compte courant bloqué","topic":"apports","level":"Intermédiaire","minutes":16,"facts":"Quatre associés de SAS ont versé chacun 8 000 € en compte courant remboursable. La banque exige que ces sommes restent 18 mois. Le président informe les associés que le conseil a décidé de convertir leurs prêts en capital sans leur demander leur accord. Un associé réclame le remboursement immédiat.","questions":"Peut-on transformer automatiquement les comptes courants en capital ? Le remboursement est-il libre ?","issues":["Qualité d’associé / prêteur","Accord du créancier","Blocage contractuel"],"rules":["Un compte courant est une créance de prêt, non un apport. C. civ., art. 1836, al.2 et autonomie contractuelle. Cass. com., 24 juin 1997 (cours)."],"application":["Les fonds sont présentés comme remboursables. Une décision unilatérale des organes ne peut convertir librement la créance en capital. Quant au remboursement, il faut vérifier si une convention de blocage a été acceptée."],"conclusion":["La conversion exige les opérations et consentements requis. Sans blocage opposable ou stipulation spécifique, le prêteur conserve en principe les droits de remboursement prévus par l’accord."],"checklist":["compte courant","prêt","consentement","convention de blocage"],"trap":"Un associé a deux qualités : associé et créancier."},{"id":"c10","title":"La machine surévaluée","topic":"apports","level":"Intermédiaire","minutes":15,"facts":"À la création d’une SARL, trois associés évaluent à 85 000 € une machine d’occasion qui ne vaut que 12 000 €. Ils renoncent au commissaire aux apports en se disant que la valeur est « une affaire privée ». Le quatrième associé découvre l’écart après immatriculation.","questions":"Quels risques juridiques ?","issues":["Évaluation d’un apport en nature","Dispense de commissaire aux apports","Responsabilité pour valeur retenue"],"rules":["C. com., art. L.223-9 : évaluation des apports en nature et responsabilité solidaire pendant 5 ans dans les situations prévues."],"application":["L’écart de valorisation est considérable. Vérifier si les conditions de dispense étaient effectivement remplies ; si non, la responsabilité de ceux tenus par le texte peut être recherchée."],"conclusion":["L’évaluation manifestement excessive expose à des sanctions civiles, et potentiellement pénales en présence de fraude. Il faut identifier les personnes visées et les conditions exactes."],"checklist":["apport en nature","commissaire","surévaluation","5 ans"],"trap":"Ne pas prétendre qu’une valeur convenue entre associés est incontestable."},{"id":"c11","title":"Cession à un investisseur","topic":"sarl_sas","level":"Débutant","minutes":11,"facts":"Bastien détient 30 % des parts d’une SARL avec trois autres associés. Il vend ses parts à une investisseuse extérieure, sans informer ses coassociés. Il soutient que les parts sociales se vendent aussi librement que des actions cotées.","questions":"La cession peut-elle produire effet sans agrément ?","issues":["Qualification SARL","Agrément des tiers","Opposabilité et régularisation"],"rules":["C. com., art. L.223-14 : cession de parts d’une SARL à un tiers soumise au régime d’agrément prévu par la loi."],"application":["La cession concerne des parts sociales à une personne étrangère à la SARL. La comparaison avec des actions cotées n’est pas pertinente."],"conclusion":["Il faut appliquer la procédure légale d’agrément et vérifier les conséquences de son non-respect ; la liberté des actions cotées ne s’applique pas à cette SARL."],"checklist":["SARL","parts sociales","tiers","agrément"],"trap":"Action ≠ part sociale."},{"id":"c12","title":"L’action SAS soi-disant libre","topic":"sarl_sas","level":"Intermédiaire","minutes":13,"facts":"Une actionnaire d’une SAS vend ses actions à un concurrent. Les statuts contiennent une clause d’agrément applicable à toute cession à un tiers, régulièrement portée à sa connaissance. Elle affirme que dans une société par actions toute cession est nécessairement libre.","questions":"L’argument est-il fondé ?","issues":["Action vs part","Liberté contractuelle statutaire SAS","Portée de la clause d’agrément"],"rules":["C. com., art. L.227-14 s. : clauses statutaires encadrant les cessions d’actions SAS selon conditions."],"application":["La SAS est bien une société par actions mais les statuts prévoient une restriction pertinente. Il faut examiner sa validité et son respect."],"conclusion":["L’argument de liberté absolue n’est pas fondé. Une clause d’agrément peut rendre cette cession irrégulière, sous les sanctions légales applicables."],"checklist":["SAS","statuts","agrément","cession"],"trap":"Ne pas confondre principe de négociabilité et liberté absolue."},{"id":"c13","title":"Le conseil à deux administrateurs","topic":"sa","level":"Intermédiaire","minutes":16,"facts":"Le conseil d’administration d’une SA ne compte plus que deux membres après une démission. Ils entendent simplement continuer à se réunir pendant un an, sans procéder à une régularisation. Le directeur général affirme qu’une SA peut choisir n’importe quel nombre d’administrateurs.","questions":"Le fonctionnement est-il régulier ?","issues":["Choix du modèle moniste","Effectif légal du conseil","Régularisation et risque"],"rules":["C. com., art. L.225-17 : 3 à 18 administrateurs en principe ; règles de régularisation en cas de vacance."],"application":["Deux administrateurs sont en dessous du minimum. La vacance appelle un traitement selon les textes plutôt qu’une tolérance d’un an décidée librement."],"conclusion":["La société doit régulariser la composition du conseil rapidement conformément aux modalités légales. La marge de choix ne va pas jusqu’à abolir le minimum."],"checklist":["SA","conseil","3 à 18","vacance"],"trap":"Ne pas appliquer au CA de SA la souplesse des organes de SAS."},{"id":"c14","title":"La transformation à 90 %","topic":"transformation","level":"Intermédiaire","minutes":15,"facts":"Une SA ancienne de sept ans, avec douze actionnaires, veut devenir une SAS. Onze actionnaires représentant 90 % du capital acceptent. Le douzième refuse. Le président estime que l’AGE à majorité qualifiée suffit et annonce la transformation le lendemain.","questions":"La transformation a-t-elle été valablement approuvée ?","issues":["SA → SAS","Unanimité","Formalités et continuité"],"rules":["C. com., art. L.227-3 : unanimité des associés pour une transformation en SAS. Art. 1844-3 : continuité de la personne morale si transformation régulière."],"application":["Il existe un vote négatif. Peu importe les 90 % du capital : l’unanimité manque. Aucune publicité ne peut réparer ce défaut du vote."],"conclusion":["La transformation ne peut être considérée régulièrement adoptée sur ces seuls faits. Si elle est valablement décidée ultérieurement, elle ne crée pas une nouvelle personne morale."],"checklist":["L227-3","unanimité","90 % insuffisant","continuité"],"trap":"Ne pas raisonner exclusivement en pourcentage de capital."},{"id":"c15","title":"La caution du dirigeant","topic":"caution","level":"Intermédiaire","minutes":19,"facts":"La présidente d’une SAS signe personnellement, en 2026, un cautionnement pour garantir un prêt commercial de 120 000 € accordé à sa société. La SAS ne rembourse plus. La présidente refuse de payer, arguant de la « responsabilité limitée » des actionnaires. La banque est un créancier professionnel.","questions":"La responsabilité limitée protège-t-elle automatiquement la caution ?","issues":["Dette commerciale","Cautionnement postérieur à 2022","Protections légales de la caution"],"rules":["C. com., art. L.110-1, 11° : cautionnement de dette commerciale ; C. civ., art. 2297, 2299, 2300 : protections applicables sous conditions."],"application":["La présidente a pris un engagement personnel distinct de sa qualité d’actionnaire. L’argument de responsabilité limitée est donc insuffisant. Il faudra vérifier validité de la mention, mise en garde et disproportion éventuelle."],"conclusion":["La banque peut rechercher la caution si son engagement est valable et exigible, sous réserve des moyens de défense légaux."],"checklist":["caution personnelle","2026","responsabilité limitée","2297","2300"],"trap":"Éviter de dire qu’une caution ne dispose d’aucune défense."},{"id":"c16","title":"La décision irrégulière de SAS en 2026","topic":"nullites","level":"Avancé","minutes":25,"facts":"Les statuts d’une SAS prévoient l’envoi des documents cinq jours avant toute décision collective. Pour une décision non expressément sanctionnée par une nullité légale, le président les envoie avec deux jours de retard. Tous les associés ont voté et le résultat est de 98 % pour. Un associé demande automatiquement la nullité au motif que les statuts n’ont pas été respectés.","questions":"La décision est-elle automatiquement annulée ? Appliquer la réforme de 2025.","issues":["Cause légale de nullité ?","Violation des statuts","Triple test 2025","Sanctions alternatives"],"rules":["Art. 1844-10 (2025) : la violation des statuts n’est pas, sauf disposition légale contraire, cause de nullité. Art. 1844-12-1 : grief, influence sur le sens, proportionnalité."],"application":["Le seul retard statutaire ne suffit pas. Le vote massif suggère une difficulté à démontrer l’influence sur la décision ; il faut rechercher un grief concret et si une disposition spéciale ouvre la nullité."],"conclusion":["La nullité n’est pas automatique et paraît difficile sur ces seuls faits. Une autre sanction ou régularisation peut éventuellement être discutée."],"checklist":["2025","statuts","grief","influence","proportionnalité"],"trap":"Le contenu du cours de 2023 sur l’annulation des décisions SAS doit être articulé avec la nouvelle loi."},{"id":"c17","title":"Un apport annulé","topic":"nullites","level":"Avancé","minutes":20,"facts":"Une société est créée en 2026 par deux fondateurs. L’un des apports en nature a été obtenu par fraude au détriment d’un tiers ; une juridiction juge l’apport nul. Le second apport est valable. Un associé affirme que l’annulation d’un apport entraîne toujours la nullité intégrale de la société.","questions":"Que provoque la nullité d’un apport ?","issues":["Nullité de l’apport","Sort des titres","Dissolution éventuelle"],"rules":["C. civ., art. 1844-10-1 (2025) : nullité de l’apport et annulation des titres correspondants ; la nullité de tous les apports entraîne dissolution."],"application":["Le cas évoque un apport annulé, mais pas tous les apports. Il faut retirer les titres correspondants et effectuer les restitutions prévues ; distinguer la survie de la société."],"conclusion":["La nullité d’un seul apport ne signifie pas automatiquement nullité de la société. La dissolution spéciale suppose la nullité de tous les apports suivant le texte."],"checklist":["1844-10-1","titres","restitution","tous les apports"],"trap":"Ne pas confondre nullité du contrat de société et nullité d’un apport."},{"id":"c18","title":"Une société occulte","topic":"sanspm","level":"Avancé","minutes":18,"facts":"Trois consultants créent volontairement un groupement sans immatriculation. Seul Luc signe les contrats, en son nom. Une cliente ignorait totalement le groupement et n’avait aucun indice d’engagement des deux autres. Après un impayé, elle réclame la totalité à chacun.","questions":"Quels associés répondent envers le tiers ?","issues":["Société en participation","Occulte / ostensible","Responsabilité envers tiers"],"rules":["C. civ., art. 1871, 1872-1 : société en participation sans personne morale ; celui qui contracte en son nom s’engage en principe seul, sauf hypothèses légales."],"application":["Luc est l’unique signataire et la cliente ignorait l’existence des autres. Aucun indice d’immixtion, d’ostensibilité ou d’apparence n’est donné."],"conclusion":["Luc paraît seul engagé envers la cliente sur ces faits. Il faudrait des circonstances supplémentaires pour étendre l’engagement aux deux autres."],"checklist":["participation","occulte","tiers","signataire","1872-1"],"trap":"Ne pas traiter la société en participation comme une SARL."},{"id":"c19","title":"Une obligation plutôt qu’une action","topic":"obligations","level":"Débutant","minutes":12,"facts":"Une jeune entreprise propose à Ana d’acheter pour 5 000 € des titres lui donnant un coupon annuel fixe de 4 % et un remboursement du nominal dans trois ans. Ana s’attend à recevoir automatiquement un siège et un droit de vote en assemblée générale.","questions":"Ana devient-elle actionnaire ? Quels risques supporte-t-elle ?","issues":["Titre de créance vs titre de capital","Coupon et maturité","Risque de crédit"],"rules":["Une obligation est en principe un titre de créance ; l’action constitue un titre de capital."],"application":["Les caractéristiques décrites (coupon fixe + remboursement à échéance) correspondent à une obligation simple, sans mention de convertibilité ou de droits de capital."],"conclusion":["Ana est normalement créancière obligataire, sans droit de vote d’actionnaire. Elle reste exposée au risque que l’émetteur ne paie pas."],"checklist":["obligation","créancier","coupon","maturité","défaut"],"trap":"Ne pas confondre coupon contractuel et dividende conditionné à une distribution."},{"id":"c20","title":"L’augmentation de capital dilutive","topic":"capital","level":"Intermédiaire","minutes":16,"facts":"Une SAS compte 100 actions. Elsa en détient 40. L’assemblée décide d’émettre 50 nouvelles actions souscrites exclusivement par un investisseur, sans qu’Elsa en souscrive. Elle prétend conserver automatiquement 40 % et affirme qu’une augmentation de capital fait nécessairement entrer de l’argent frais même par incorporation de réserves.","questions":"Quelle est sa nouvelle participation ? Toutes les augmentations injectent-elles des fonds ?","issues":["Dilution mathématique","Droit préférentiel selon forme","Réserves ≠ cash entrant"],"rules":["Répartition = nombre de titres détenus / total des titres. Le droit préférentiel varie selon formes/règles applicables. L’incorporation de réserves est une opération comptable."],"application":["Elsa garde 40 actions mais le total devient 150. Sa part est 40 / 150 = 26,67 %. Une incorporation de réserves n’apporte aucun fonds externe."],"conclusion":["Sa part passe à environ 26,67 % sous réserve de particularités de titres ; l’affirmation sur les réserves est fausse. Examiner validité de l’émission et statuts."],"checklist":["40/150","26,67 %","dilution","réserves"],"trap":"Ne pas confondre augmentation de nominal et émission de nouveaux titres."},{"id":"c21","title":"La mésentente ne suffit pas","topic":"affectio","level":"Intermédiaire","minutes":14,"facts":"Deux associés d’une SARL se disputent depuis huit mois au sujet des tarifs, mais les décisions sont régulièrement votées, les comptes approuvés, les contrats exécutés et l’activité reste normale. L’un veut dissoudre la société pour « perte d’affectio societatis ».","questions":"La dissolution pour justes motifs paraît-elle fondée ?","issues":["Mésentente entre associés","Paralysie du fonctionnement","Solution et alternatives"],"rules":["C. civ., art. 1844-7, 5° : dissolution pour justes motifs ; la jurisprudence requiert une paralysie fonctionnelle pour la mésentente."],"application":["Le conflit existe, mais aucune paralysie n’est caractérisée ; les organes continuent de fonctionner."],"conclusion":["Une dissolution sur le seul motif de mésentente paraît infondée. Chercher des mécanismes statutaires de gestion du conflit ou de sortie."],"checklist":["1844-7","mésentente","paralysie","justes motifs"],"trap":"La perte d’amitié ne suffit pas."},{"id":"c22","title":"L’épreuve finale : trois problèmes","topic":"formation","level":"Avancé","minutes":35,"facts":"Quatre amis projettent une SAS pour exploiter un café. Avant immatriculation, Inès signe un bail pour la « SAS Café Rive en formation », mais aucun état des actes ni mandat n’existe. La SAS est immatriculée le 1er avril ; ses associés ne délibèrent jamais sur la reprise. Les statuts prévoient que l’investisseur reçoit tous les bénéfices pour toujours. Enfin, le président signe personnellement en 2026 une caution du prêt bancaire de la SAS. Six mois plus tard, le café fait défaut.","questions":"Traitez séparément : 1. le bail ; 2. la clause de bénéfices ; 3. la caution personnelle.","issues":["Reprise du bail","Clause léonine","Engagement de caution","Distinguer les sanctions"],"rules":["Art. L.210-6 et R.210-5 s. : reprise des engagements en formation.","Art. 1844-1 : prohibition des clauses léonines.","Art. L.110-1 11°, C. civ. 2297/2300 : caution d’une dette commerciale."],"application":["Bail : la société est immatriculée, mais aucun mécanisme de reprise décrit ; Inès reste a priori engagée. Clause : allouer tout bénéfice à l’investisseur pour toujours exclut les autres : stipulation réputée non écrite. Caution : la responsabilité limitée de l’associé n’empêche pas l’engagement personnel du président."],"conclusion":["Trois solutions distinctes : engagement personnel d’Inès sur le bail, neutralisation de la clause léonine, caution potentiellement poursuivable sous réserve des protections applicables."],"checklist":["formation","reprise","léonine","caution","3 conclusions"],"trap":"Il faut trois mini-syllogismes, pas un seul « tout est nul »."}],"quizzes":[{"id":"q1","topic":"fondations","q":"Quelle distinction est correcte ?","options":["La société est toujours une activité économique","L’entreprise est une notion économique, la société une notion juridique","La société est toujours cotée","L’entreprise est toujours immatriculée au RCS"],"answer":1,"why":"Le cours distingue le contrat et la personne morale de l’organisation économique."},{"id":"q2","topic":"fondations","q":"Quel texte définit le contrat de société ?","options":["C. civ., art. 1832","C. civ., art. 1240","C. com., art. L.227-3","C. pén., art. 121-2"],"answer":0,"why":"L’article 1832 constitue la base de qualification."},{"id":"q3","topic":"fondations","q":"La SARL est commerciale…","options":["Uniquement si elle vend des biens","Uniquement si elle compte 50 associés","Par sa forme","Seulement après un bénéfice"],"answer":2,"why":"La commercialité par la forme est indépendante de l’activité."},{"id":"q4","topic":"fondations","q":"Quelle structure n’a en principe pas de personnalité morale ?","options":["SA immatriculée","SARL immatriculée","SASU immatriculée","Société en participation"],"answer":3,"why":"La société en participation n’est pas immatriculée."},{"id":"q5","topic":"fondations","q":"Qu’est-ce que l’intuitu personae ?","options":["Le montant du capital","L’importance de la personne de l’associé","La valeur nominale","Le droit de vote double"],"answer":1,"why":"C’est central pour de nombreuses sociétés de personnes."},{"id":"q6","topic":"contrat","q":"Quels sont les trois éléments classiques du contrat de société ?","options":["Capital, siège, dirigeant","Apports, vocation au résultat, affectio societatis","Immatriculation, assurance, banque","Bénéfices, impôt, publicité"],"answer":1,"why":"Les deux premiers sont exprimés à l’art. 1832, l’affectio est jurisprudentiel."},{"id":"q7","topic":"contrat","q":"La création d’une société à associé unique est…","options":["Toujours interdite","Toujours possible quelle que soit la forme","Possible quand la loi le prévoit","Réservée aux SA cotées"],"answer":2,"why":"EURL et SASU sont des exemples."},{"id":"q8","topic":"contrat","q":"Quel élément relève du droit commun des contrats ?","options":["L’enregistrement au RNE","Le consentement libre et éclairé","La nomination du président","La rédaction du procès-verbal d’AGE"],"answer":1,"why":"Consentement, capacité et contenu licite sont essentiels."},{"id":"q9","topic":"contrat","q":"Un associé de SNC doit en principe…","options":["Être salarié","Être commerçant","Détenir une action cotée","Être une personne morale"],"answer":1,"why":"Les associés de SNC ont la qualité de commerçants."},{"id":"q10","topic":"contrat","q":"Quelle phrase est exacte ?","options":["Une promesse de négocier vaut automatiquement société créée","Des pourparlers ne sont pas nécessairement un contrat de société","Un mail vaut toujours statuts","Il faut nécessairement 7 fondateurs"],"answer":1,"why":"L’engagement doit être analysé selon son contenu réel."},{"id":"q11","topic":"apports","q":"Que signifie « libération » d’un apport ?","options":["La promesse de payer","Le versement effectif","La distribution des dividendes","La radiation du RCS"],"answer":1,"why":"Souscription = engagement ; libération = exécution."},{"id":"q12","topic":"apports","q":"Part minimale initiale en numéraire en SARL ?","options":["10 %","20 %","50 %","100 %"],"answer":1,"why":"Au moins 1/5 à la constitution selon L.223-7."},{"id":"q13","topic":"apports","q":"Part minimale initiale en numéraire en SAS ?","options":["10 %","20 %","50 %","100 %"],"answer":2,"why":"Au moins la moitié des apports en numéraire."},{"id":"q14","topic":"apports","q":"Quel apport n’entre pas dans le capital social ?","options":["Numéraire","Nature","Industrie","Tout entre dans le capital"],"answer":2,"why":"L’apport en industrie peut donner des droits sociaux sans constituer du capital."},{"id":"q15","topic":"apports","q":"Quelle distinction est correcte ?","options":["Capital = trésorerie","Capital = patrimoine total","Capital = valeur nominale statutaire","Capital = bénéfice net"],"answer":2,"why":"Capital, capitaux propres et trésorerie sont distincts."},{"id":"q16","topic":"apports","q":"En SARL, surévaluation sans commissaire : responsabilité possible pendant…","options":["6 mois","1 an","5 ans","20 ans"],"answer":2,"why":"Le support renvoie à l’art. L.223-9."},{"id":"q17","topic":"apports","q":"L’apport en jouissance transmet…","options":["Toujours la pleine propriété","Le droit d’utilisation dans les conditions de l’apport","La direction générale","Uniquement un droit de vote"],"answer":1,"why":"La propriété n’est pas transférée comme pour l’apport en propriété."},{"id":"q18","topic":"apports","q":"Une avance remboursable d’un associé est en principe…","options":["Un dividende","Un compte courant d’associé","Un apport en industrie","Une prime de fusion"],"answer":1,"why":"C’est juridiquement un prêt / une créance."},{"id":"q19","topic":"resultats","q":"Quelle sanction frappe la clause léonine ?","options":["Dissolution obligatoire","Prison automatique","Clause réputée non écrite","Annulation de toutes les décisions"],"answer":2,"why":"Art. 1844-1 : la clause est neutralisée."},{"id":"q20","topic":"resultats","q":"Une répartition 70/30 est-elle interdite par principe ?","options":["Oui car non proportionnelle","Non, les répartitions inégales peuvent être valables","Oui si la société est une SAS","Oui si l’associé est mineur"],"answer":1,"why":"L’exclusion totale est la ligne rouge."},{"id":"q21","topic":"resultats","q":"La contribution aux pertes est-elle identique à l’obligation aux dettes ?","options":["Toujours","Jamais dans aucune situation","Non : l’une concerne les associés entre eux, l’autre les créanciers","Oui dans toutes les SAS"],"answer":2,"why":"Ne pas mélanger rapports internes et externes."},{"id":"q22","topic":"resultats","q":"Qu’est-ce qui est clairement léonin ?","options":["80/20 des bénéfices","30/70 des pertes","100 % des bénéfices à un seul associé pour toute la vie sociale","Un dividende ponctuellement non distribué"],"answer":2,"why":"L’attribution totale du profit est interdite."},{"id":"q23","topic":"affectio","q":"À quoi renvoie l’affectio societatis ?","options":["Au taux de TVA","À la volonté de collaboration dans un intérêt commun","À l’immatriculation","À la valorisation de l’apport"],"answer":1,"why":"Notion élaborée par la jurisprudence."},{"id":"q24","topic":"affectio","q":"Pour dissoudre en raison d’une mésentente, il faut en principe…","options":["Un conflit sur les réseaux","Une paralysie du fonctionnement soci
