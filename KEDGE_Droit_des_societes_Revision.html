al","Deux associés seulement","Une SAS"],"answer":1,"why":"Une simple mauvaise entente ne suffit pas."},{"id":"q25","topic":"affectio","q":"Quel texte vise la dissolution pour justes motifs ?","options":["1844-7, 5°","1842","L.227-3","2297"],"answer":0,"why":"Article 1844-7, 5°."},{"id":"q26","topic":"personnalite","q":"La personnalité morale de la société naît en principe…","options":["À l’idée de créer","À la signature du premier devis","À l’immatriculation au RCS","Au premier bénéfice"],"answer":2,"why":"Art. 1842 du Code civil."},{"id":"q27","topic":"personnalite","q":"Qui possède les biens d’une SARL immatriculée ?","options":["Les associés proportionnellement","La SARL elle-même","Le gérant personnellement","Le banquier"],"answer":1,"why":"Le patrimoine social est distinct."},{"id":"q28","topic":"personnalite","q":"Quel texte fonde la responsabilité pénale d’une personne morale ?","options":["Art. 121-2 C. pén.","Art. 1832 C. civ.","Art. L.227-3 C. com.","Art. 2297 C. civ."],"answer":0,"why":"Infraction pour son compte par ses organes/représentants."},{"id":"q29","topic":"personnalite","q":"Selon l’art. 1833, la gestion doit prendre en considération…","options":["Seulement l’intérêt des dirigeants","Les enjeux sociaux et environnementaux","Toujours le maximum de dividendes","Uniquement la concurrence"],"answer":1,"why":"L’intérêt social et la prise en considération des enjeux ESG sont au programme."},{"id":"q30","topic":"rne","q":"Depuis 2023, le RNE…","options":["A supprimé le RCS pour toutes les sociétés","Centralise les informations et formalités des entreprises","Est réservé aux SA cotées","Délivre les diplômes"],"answer":1,"why":"Le RNE coexiste avec le RCS selon les obligations."},{"id":"q31","topic":"rne","q":"Le dépôt d’un dossier au guichet unique suffit-il à établir la personnalité morale ?","options":["Oui toujours","Non, il faut considérer l’immatriculation applicable","Oui si les statuts sont longs","Oui seulement en SNC"],"answer":1,"why":"Le guichet est un canal, pas la personnalité morale."},{"id":"q32","topic":"formation","q":"En l’absence de reprise d’un acte, qui reste en principe engagé ?","options":["Personne","Uniquement le comptable","La personne qui a agi","Tous les actionnaires indistinctement"],"answer":2,"why":"Art. L.210-6."},{"id":"q33","topic":"formation","q":"Quel mécanisme permet une reprise lors de l’immatriculation ?","options":["Un état des actes annexé aux statuts","Un appel téléphonique sans trace","Un paiement de dividende","Une annonce LinkedIn"],"answer":0,"why":"Un des trois mécanismes classiques."},{"id":"q34","topic":"formation","q":"Un mandat spécial pour reprendre un acte doit viser…","options":["N’importe quel acte futur","Des engagements déterminés","Seulement la raison d’être","Uniquement les dividendes"],"answer":1,"why":"La détermination des actes est essentielle."},{"id":"q35","topic":"formation","q":"Quel changement jurisprudentiel est intervenu fin 2023 ?","options":["Suppression de l’immatriculation","Prise en compte de la commune intention de contracter pour la société en formation","Abolition du Code civil","Reprise automatique de tous les contrats"],"answer":1,"why":"Revirement de novembre 2023 sur le formalisme du libellé."},{"id":"q36","topic":"formation","q":"Quelle est l’incidence de la reprise régulière ?","options":["L’acte est réputé conclu à l’origine par la société","L’acte devient pénal","Le capital double","Le bailleur perd ses droits"],"answer":0,"why":"Reprise avec effet rétroactif."},{"id":"q37","topic":"sanspm","q":"Une société créée de fait est…","options":["Toujours immatriculée","Reconnaissable à partir des comportements malgré l’absence de formalisation","Toujours une SA","Impossible entre partenaires"],"answer":1,"why":"Elle est reconnue par le juge selon les éléments du contrat."},{"id":"q38","topic":"sanspm","q":"Dans une société en participation occulte, envers un tiers ignorant les autres associés…","options":["Tous sont nécessairement solidaires","Le signataire est en principe seul engagé","La société immatriculée paie","Le RNE règle la dette"],"answer":1,"why":"Art. 1872-1 avec exceptions."},{"id":"q39","topic":"sanspm","q":"La société en participation possède-t-elle un patrimoine social autonome ?","options":["Oui en toute hypothèse","Non, elle n’a pas de personnalité morale","Oui seulement avec trois associés","Oui au-delà de 37 000 €"],"answer":1,"why":"Pas de patrimoine propre à une personne morale distincte."},{"id":"q40","topic":"nullites","q":"Depuis octobre 2025, la nullité de la société est possible notamment pour…","options":["Tout vice de consentement d’un fondateur","La seule mésentente","L’incapacité de tous les fondateurs","Tout retard de convocation"],"answer":2,"why":"Art. 1844-10 réformé."},{"id":"q41","topic":"nullites","q":"La nullité d’un seul apport entraîne-t-elle nécessairement la nullité de la société ?","options":["Oui sans exception","Non, un mécanisme distinct régit l’apport et ses titres","Oui en SARL","Oui en SAS"],"answer":1,"why":"Art. 1844-10-1."},{"id":"q42","topic":"nullites","q":"Quel trio constitue le test de nullité des décisions sociales depuis 2025 ?","options":["Capital, siège, dirigeant","Grief, influence sur la décision, proportionnalité","Apports, banque, dividendes","RNE, RCS, greffe"],"answer":1,"why":"Art. 1844-12-1."},{"id":"q43","topic":"nullites","q":"Une violation des statuts suffit-elle toujours à annuler une décision sociale en 2026 ?","options":["Oui","Non, sauf disposition légale contraire et conditions de nullité","Seulement si la société est rentable","Toujours avec 10 salariés"],"answer":1,"why":"La règle actuelle de l’art. 1844-10 est restrictive."},{"id":"q44","topic":"nullites","q":"Si la cause de nullité disparaît avant que le tribunal statue au fond en première instance…","options":["L’action s’éteint en principe","La société est systématiquement liquidée","Le juge double le capital","Il n’y a jamais de régularisation"],"answer":0,"why":"Art. 1844-11 depuis 2025."},{"id":"q45","topic":"formes","q":"Quelle forme engage en principe les associés indéfiniment et solidairement ?","options":["SAS","SARL","SNC","SA"],"answer":2,"why":"Le régime de la SNC diffère profondément de celui des formes à responsabilité limitée."},{"id":"q46","topic":"formes","q":"Capital minimum général d’une SA ?","options":["1 €","10 000 €","37 000 €","100 000 €"],"answer":2,"why":"Sous réserve des régimes particuliers applicables."},{"id":"q47","topic":"formes","q":"Une SARL peut compter…","options":["2 à 100 associés en version pluripersonnelle","Uniquement 7 associés","Pas plus de 2 associés","1000 associés"],"answer":0,"why":"L’EURL est la forme unipersonnelle."},{"id":"q48","topic":"formes","q":"En SCA, quel associé est en principe indéfiniment et solidairement responsable ?","options":["Commanditaire","Commandité","Tout actionnaire sans distinction","Obligataire"],"answer":1,"why":"La dualité commandité/commanditaire est fondamentale."},{"id":"q49","topic":"formes","q":"Quel dirigeant est obligatoire en SAS ?","options":["Gérant","Président","Conseil de surveillance","Directoire"],"answer":1,"why":"La SAS a un président, la SARL un gérant."},{"id":"q50","topic":"sarl_sas","q":"La SARL émet principalement…","options":["Des actions cotées","Des parts sociales","Des obligations souveraines","Des options obligatoires"],"answer":1,"why":"SARL = parts sociales ; SAS = actions."},{"id":"q51","topic":"sarl_sas","q":"La cession de parts SARL à un tiers requiert en principe…","options":["Un agrément","Le dépôt de plainte","Un vote du conseil de surveillance de SA","L’accord du banquier obligataire"],"answer":0,"why":"Art. L.223-14."},{"id":"q52","topic":"sarl_sas","q":"Une SAS peut prévoir une clause statutaire d’agrément ?","options":["Non jamais","Oui dans le cadre légal","Seulement si cotée","Seulement avec 100 associés"],"answer":1,"why":"La liberté de cession n’est pas absolue."},{"id":"q53","topic":"sa","q":"Quels sont les deux modes de gouvernance d’une SA ?","options":["Gérant/directeur et SNC","Conseil d’administration ou directoire/conseil de surveillance","SASU ou EURL","RNE ou RCS"],"answer":1,"why":"La loi impose ces deux architectures."},{"id":"q54","topic":"sa","q":"Combien d’administrateurs au CA de SA en principe ?","options":["1 à 2","3 à 18","15 à 100","Toujours 7"],"answer":1,"why":"Art. L.225-17."},{"id":"q55","topic":"sa","q":"Dans le modèle dualiste, qui exerce la direction ?","options":["Le conseil de surveillance","Le directoire","Les obligataires","Le greffier"],"answer":1,"why":"Le conseil de surveillance contrôle la gestion."},{"id":"q56","topic":"cession","q":"Les actions sont émises par…","options":["Les sociétés par actions","Toutes les sociétés civiles","Uniquement les SNC","Uniquement les EURL"],"answer":0,"why":"SA, SAS, SCA."},{"id":"q57","topic":"cession","q":"Quelle proposition est juste ?","options":["Une action donne toujours le même droit de vote","Certaines actions de préférence aménagent les droits","Les parts sociales sont toujours librement négociables","L’actionnaire est un prêteur"],"answer":1,"why":"Les catégories d’actions peuvent différer."},{"id":"q58","topic":"capital","q":"Avec 40 actions sur 150, la participation est…","options":["40 %","30 %","26,67 %","60 %"],"answer":2,"why":"40 / 150 × 100."},{"id":"q59","topic":"capital","q":"Une incorporation de réserves apporte-t-elle nécessairement de l’argent frais ?","options":["Oui","Non","Seulement en SARL","Seulement en SNC"],"answer":1,"why":"C’est une modification comptable de postes de capitaux propres."},{"id":"q60","topic":"capital","q":"Quel mécanisme aide à limiter la dilution en SA ?","options":["Le DPS","La solidarité entre cautions","Le RNE","La lettre de change"],"answer":0,"why":"Droit préférentiel de souscription, selon conditions."},{"id":"q61","topic":"obligations","q":"Le titulaire d’une obligation simple est…","options":["Un associé","Un créancier","Un gérant","Un administrateur"],"answer":1,"why":"L’obligation représente une créance."},{"id":"q62","topic":"obligations","q":"Le « coupon » est…","options":["Le prix du capital","L’intérêt périodique d’une obligation","Une part sociale","Un agrément de cession"],"answer":1,"why":"Terme de financement par dette."},{"id":"q63","topic":"obligations","q":"La maturité d’une obligation désigne…","options":["La date d’anniversaire du PDG","L’échéance du titre","Le nombre d’actionnaires","La capitalisation boursière"],"answer":1,"why":"Date de remboursement prévue."},{"id":"q64","topic":"obligations","q":"Une OCA peut…","options":["Être convertie en actions selon ses modalités","Être forcément une part sociale","Écarter tout risque de crédit","Remplacer le RCS"],"answer":0,"why":"Obligation convertible en actions."},{"id":"q65","topic":"financement","q":"Le crédit-bail correspond généralement à…","options":["Une location avec option d’achat","Un apport en industrie","Une dissolution de SA","Une clause léonine"],"answer":0,"why":"Le bailleur reste propriétaire jusqu’à une éventuelle levée d’option."},{"id":"q66","topic":"financement","q":"Une cession Dailly porte sur…","options":["Les notes d’examen","Des créances professionnelles","L’affectio societatis","Des parts de SNC uniquement"],"answer":1,"why":"Cession ou nantissement de créances au bénéfice de l’établissement de crédit."},{"id":"q67","topic":"financement","q":"Le factor peut notamment…","options":["Toujours devenir actionnaire","Financer et recouvrer des factures commerciales","Révoquer un directeur général","Créer une SA automatiquement"],"answer":1,"why":"Affacturage ; la garantie dépend du contrat."},{"id":"q68","topic":"caution","q":"La responsabilité limitée de l’actionnaire empêche-t-elle qu’il soit caution personnelle ?","options":["Oui","Non","Oui si le prêt est commercial","Oui en SASU seulement"],"answer":1,"why":"La caution est un engagement distinct."},{"id":"q69","topic":"caution","q":"Depuis 2022, le cautionnement d’une dette commerciale est en principe…","options":["Civil parce que l’associé n’est pas commerçant","Commercial par la forme","Nul","Un dividende"],"answer":1,"why":"C. com., art. L.110-1, 11°."},{"id":"q70","topic":"caution","q":"Quel texte vise une protection concernant la disproportion de la caution personne physique ?","options":["Art. 2300 C. civ.","Art. 1832 C. civ.","Art. L.227-3 C. com.","Art. 1873 C. civ."],"answer":0,"why":"Le mécanisme s’applique dans les conditions du texte."},{"id":"q71","topic":"transformation","q":"Transformer une SA en SAS exige…","options":["50 % des voix","Les deux tiers","L’unanimité des associés","Une décision du seul président"],"answer":2,"why":"Art. L.227-3."},{"id":"q72","topic":"transformation","q":"Une transformation régulière de SA en SAS…","options":["Dissout automatiquement l’ancienne personne morale","Crée forcément une personne morale nouvelle","Conserve la personnalité morale","Annule tous les contrats"],"answer":2,"why":"Art. 1844-3."},{"id":"q73","topic":"transformation","q":"Le formulaire M2 cité dans une fiche de 2023 doit-il être traité comme l’unique formalité actuelle ?","options":["Oui","Non, les procédures ont évolué","Oui si le siège est à Paris","Oui seulement pour les SA"],"answer":1,"why":"Référer aux démarches actuelles du guichet unique."}],"flashcards":[{"id":"f1","topic":"fondations","front":"Société ≠ entreprise ?","back":"Société = notion juridique (contrat puis éventuellement personne morale) ; entreprise = organisation économique."},{"id":"f2","topic":"fondations","front":"La commercialité par la forme ?","back":"SARL, SAS, SA, SNC, SCS, SCA sont commerciales par la forme, indépendamment de leur activité."},{"id":"f3","topic":"fondations","front":"Qu’est-ce que l’intuitu personae ?","back":"L’importance de la personne et des qualités de l’associé dans le lien sociétaire."},{"id":"f4","topic":"contrat","front":"Art. 1832 du Code civil ?","back":"Mise en commun de biens/industrie, entreprise commune, vocation aux bénéfices/économies et contribution aux pertes."},{"id":"f5","topic":"contrat","front":"Les trois éléments du contrat de société ?","back":"Apports ; participation aux résultats/pertes ; affectio societatis."},{"id":"f6","topic":"contrat","front":"Art. 1128 : trois conditions ?","back":"Consentement des parties, capacité de contracter, contenu licite et certain."},{"id":"f7","topic":"contrat","front":"SASU / EURL ?","back":"SAS / SARL constituées d’un seul associé dans les conditions légales."},{"id":"f8","topic":"apports","front":"Apport en numéraire ?","back":"Somme d’argent mise à disposition de la société."},{"id":"f9","topic":"apports","front":"Apport en nature ?","back":"Bien autre que de l’argent ; nécessite une évaluation adaptée."},{"id":"f10","topic":"apports","front":"Apport en industrie ?","back":"Travail, savoir-faire ou compétence ; droits sociaux mais pas de capital social."},{"id":"f11","topic":"apports","front":"Souscription vs libération ?","back":"Souscription = engagement d’apporter ; libération = versement effectif."},{"id":"f12","topic":"apports","front":"SARL : libération initiale du numéraire ?","back":"Au moins 1/5 (20 %) à la constitution, solde en 5 ans."},{"id":"f13","topic":"apports","front":"SAS / SA : libération initiale du numéraire ?","back":"Au moins la moitié (50 %) à la constitution, solde en 5 ans."},{"id":"f14","topic":"apports","front":"Capital vs capitaux propres ?","back":"Capital = chiffre statutaire ; capitaux propres = ensemble des fonds propres comptables."},{"id":"f15","topic":"apports","front":"Compte courant d’associé ?","back":"Prêt de l’associé à la société, créance de remboursement ; distinct de l’apport."},{"id":"f16","topic":"resultats","front":"Clause léonine : sanction ?","back":"Stipulation réputée non écrite (art. 1844-1)."},{"id":"f17","topic":"resultats","front":"Répartition des profits 90/10 ?","back":"Possiblement licite : l’inégalité n’est pas interdite en soi ; vérifier exclusion totale."},{"id":"f18","topic":"resultats","front":"Contribution aux pertes vs dettes sociales ?","back":"Pertes = répartition interne ; dettes = obligation envers les créanciers, dépendant de la forme."},{"id":"f19","topic":"affectio","front":"Affectio societatis ?","back":"Volonté de collaborer effectivement dans un intérêt commun sur un pied d’égalité juridique."},{"id":"f20","topic":"affectio","front":"Mésentente : dissolution ?","back":"Elle doit paralyser le fonctionnement social, pas seulement affecter les relations personnelles."},{"id":"f21","topic":"personnalite","front":"Naissance de la personnalité morale ?","back":"En principe immatriculation au RCS, art. 1842."},{"id":"f22","topic":"personnalite","front":"Autonomie patrimoniale ?","back":"Les biens et les dettes de la personne morale sont distincts de ceux de ses associés."},{"id":"f23","topic":"personnalite","front":"Intérêt social et ESG ?","back":"Art. 1833 : gestion dans l’intérêt social en considération des enjeux sociaux et environnementaux."},{"id":"f24","topic":"rne","front":"RNE ou RCS ?","back":"RNE = registre national d’information/formalités ; RCS reste applicable pour les sociétés concernées et détermine leur personnalité morale."},{"id":"f25","topic":"formation","front":"Personne engagée avant immatriculation ?","back":"Celle qui a agi pour le compte de la société en formation, jusqu’à reprise régulière."},{"id":"f26","topic":"formation","front":"Les 3 reprises classiques ?","back":"État des actes annexé aux statuts ; mandat déterminé ; décision des associés après immatriculation."},{"id":"f27","topic":"formation","front":"Novembre 2023 : quel revirement ?","back":"Le juge recherche la commune intention au regard des circonstances, sans rigidité absolue de la formule du contrat."},{"id":"f28","topic":"formation","front":"Effet de la reprise ?","back":"La société immatriculée est réputée partie à l’acte dès l’origine."},{"id":"f29","topic":"sanspm","front":"Société en participation ?","back":"Groupement volontairement non immatriculé : pas de personnalité morale."},{"id":"f30","topic":"sanspm","front":"Société créée de fait ?","back":"Société révélée par des comportements réunissant en principe les éléments sociétaires."},{"id":"f31","topic":"sanspm","front":"Société en participation occulte : tiers ?","back":"En principe le signataire répond seul ; des exceptions sont possibles selon l’apparence et l’immixtion."},{"id":"f32","topic":"nullites","front":"Réforme des nullités : date ?","back":"Ordonnance du 12 mars 2025, entrée en vigueur le 1er octobre 2025."},{"id":"f33","topic":"nullites","front":"Nullité de société en 2026 ?","back":"Art. 1844-10 : incapacité de tous les fondateurs ou violation du minimum de deux associés."},{"id":"f34","topic":"nullites","front":"Nullité d’un apport ?","back":"Art. 1844-10-1 : annulation des titres correspondants / restitutions ; tous les apports nuls → dissolution."},{"id":"f35","topic":"nullites","front":"Triple test de nullité d’une décision ?","back":"Art. 1844-12-1 : grief ; influence sur le sens de la décision ; proportionnalité au regard de l’intérêt social."},{"id":"f36","topic":"nullites","front":"Violation des statuts = nullité ?","back":"Pas en principe, sauf si une loi le prévoit."},{"id":"f37","topic":"nullites","front":"Art. 1844-11 ?","back":"L’action en nullité s’éteint si sa cause a disparu lors du jugement au fond de première instance."},{"id":"f38","topic":"formes","front":"SNC : responsabilité des associés ?","back":"Indéfinie et solidaire pour les dettes sociales, suivant les textes applicables."},{"id":"f39","topic":"formes","front":"SARL : combien d’associés ?","back":"2 à 100 (EURL = 1)."},{"id":"f40","topic":"formes","front":"SA : capital minimal général ?","back":"37 000 €."},{"id":"f41","topic":"formes","front":"SAS : direction obligatoire ?","back":"Un président ; autres organes possibles selon statuts."},{"id":"f42","topic":"formes","front":"SCS / SCA : commandité ?","back":"Associé en principe indéfiniment et solidairement responsable, par opposition au commanditaire."},{"id":"f43","topic":"sarl_sas","front":"SARL : titres ?","back":"Des parts sociales ; cession aux tiers soumise au régime légal d’agrément."},{"id":"f44","topic":"sarl_sas","front":"SAS : titres ?","back":"Des actions, avec clauses statutaires possibles d’agrément, préemption, inaliénabilité."},{"id":"f45","topic":"sa","front":"SA moniste ?","back":"Conseil d’administration et directeur général, pouvant éventuellement cumuler avec présidence du conseil."},{"id":"f46","topic":"sa","front":"SA dualiste ?","back":"Directoire (dirige) + conseil de surveillance (contrôle)."},{"id":"f47","topic":"sa","front":"CA d’une SA : effectif ?","back":"3 à 18 administrateurs en principe."},{"id":"f48","topic":"cession","front":"Actionnaire vs obligataire ?","back":"Actionnaire = associé et titres de capital ; obligataire = créancier et titre de dette."},{"id":"f49","topic":"capital","front":"Dilution : formule ?","back":"Actions détenues / total d’actions après opération × 100."},{"id":"f50","topic":"capital","front":"Incorporation de réserves ?","back":"Augmente le capital statutaire sans apporter de trésorerie nouvelle."},{"id":"f51","topic":"capital","front":"DPS ?","back":"Droit préférentiel de souscription : faculté de souscrire prioritairement selon les règles applicables."},{"id":"f52","topic":"obligations","front":"Coupon ?","back":"Intérêt prévu périodiquement sur une obligation."},{"id":"f53","topic":"obligations","front":"Maturité ?","back":"Date à laquelle l’obligation arrive à échéance."},{"id":"f54","topic":"obligations","front":"OCA ?","back":"Obligation convertible en actions selon les modalités du titre."},{"id":"f55","topic":"financement","front":"Cession Dailly ?","back":"Mobilisation de créances professionnelles au profit d’un établissement de crédit."},{"id":"f56","topic":"financement","front":"Affacturage ?","back":"Transfert / gestion / financement et parfois garantie de créances par un factor, selon la convention."},{"id":"f57","topic":"caution","front":"Caution et responsabilité limitée ?","back":"L’associé peut prendre un engagement personnel distinct qui engage son patrimoine."},{"id":"f58","topic":"caution","front":"Caution d’une dette commerciale depuis 2022 ?","back":"Commerciale par la forme, C. com., art. L.110-1, 11°."},{"id":"f59","topic":"caution","front":"Protections de la caution personne physique ?","back":"Mention (2297), mise en garde (2299), proportionnalité (2300) selon conditions légales."},{"id":"f60","topic":"transformation","front":"Transformation en SAS : majorité ?","back":"Unanimité des associés, art. L.227-3."},{"id":"f61","topic":"transformation","front":"Transformation régulière : personne morale ?","back":"Elle est maintenue : art. 1844-3."}],"sources":{"cours":"Diaporama KEDGE — Droit des sociétés, thèmes 1 & 2 (86 diapositives)","formes":"Lexbase / Conseil national des barreaux — Sociétés commerciales, tableau comparatif (8 p.)","sarl":"SAS ET SARL — Tableau comparatif (7 p., support en images)","rne":"Lexbase — Registre national des entreprises (09.05.2023, 3 p.)","reprise":"Lexbase — Reprendre les actes passés par la société en formation (10.04.2024, 4 p.)","caution":"Lexbase — Cautionner les dettes de la société (10.04.2024, 5 p.)","gouv":"Lexbase — Choisir le mode de gouvernance d’une SA (10.04.2024, 6 p.)","transfo":"Lexbase — Transformer une SA en SAS (17.03.2023, 4 p.)","parts":"Différence entre parts sociales et actions (4 p.)","oblig":"Mémo sur les obligations (4 p.)","fin":"Mémento n°1 — Cours financement des entreprises KEDGE (31 p.)","legifrance":"Légifrance — Code civil / Code de commerce, version en vigueur 2026"},"legal":[["1832","Code civil","Définition du contrat de société","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006444041"],["1833","Code civil","Intérêt social, enjeux sociaux et environnementaux","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000037289229"],["1842","Code civil","Personnalité morale et immatriculation","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006444134"],["1844-1","Code civil","Bénéfices, pertes, clauses léonines","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006444143"],["1844-7","Code civil","Dissolution et justes motifs","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006444153"],["1844-10","Code civil","Nullités - nouvelle rédaction 2025","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000051322322"],["1844-10-1","Code civil","Nullité des apports - texte créé en 2025","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000051317279"],["1844-11","Code civil","Régularisation - nouvelle rédaction 2025","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000051322337"],["1844-12-1","Code civil","Triple test de nullité des décisions sociales - 2025","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000051317310"],["1872-1","Code civil","Engagements envers tiers, société en participation","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006444196"],["L.210-6","Code de commerce","Société en formation, actes et reprise","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006219066"],["L.223-14","Code de commerce","Agrément des parts de SARL","https://www.legifrance.gouv.fr/search/code?query=L223-14&tab_selection=code"],["L.227-3","Code de commerce","Transformation en SAS : unanimité","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000006226980"],["L.227-9","Code de commerce","Décisions collectives de SAS après réforme 2025","https://www.legifrance.gouv.fr/codes/article_lc/LEGIARTI000051322706"],["L.110-1","Code de commerce","Acte commercial : cautionnement de dette commerciale","https://www.legifrance.gouv.fr/search/code?query=L110-1&tab_selection=code"],["2297","Code civil","Mention du cautionnement de la personne physique","https://www.legifrance.gouv.fr/search/code?query=2297&tab_selection=code"],["2300","Code civil","Disproportion du cautionnement","https://www.legifrance.gouv.fr/search/code?query=2300&tab_selection=code"]],"slides":[{"n":1,"body":"DROIT DES SOCIÉTÉS\nThèmes 1 & 2\nLe contrat de société • La société, personne morale\nSupport synthétique de cours — KEDGE"},{"n":2,"body":"INTRODUCTION\nLe fil directeur du cours\nComprendre ce qui fait juridiquement une société.\nMaîtriser le contrat de société et ses trois éléments constitutifs.\nComprendre la naissance, les effets et les limites de la personnalité morale.\nSavoir traiter la période de formation et les sociétés sans personnalité morale.\nÀ RETENIR\nLe droit des sociétés articule contrat, organisation et personnalité morale.\n2"},{"n":3,"body":"Introduction & rappels\nLes notions indispensables avant les thèmes 1 et 2"},{"n":4,"body":"INTRODUCTION\nLa société a deux visages\n1. Un contrat\nContrat spécial soumis au droit commun des contrats et aux règles propres du droit des sociétés.\n2. Une personne morale\nAprès immatriculation, la société devient en principe un sujet de droit autonome, distinct de ses associés.\nÀ RETENIR\nNe jamais confondre contrat de société et personne morale.\n4"},{"n":5,"body":"INTRODUCTION\nSociété ≠ entreprise\nSOCIÉTÉ\nNotion juridique : contrat puis, le plus souvent, personne morale.\nENTREPRISE\nNotion économique : réunion de moyens pour exercer une activité économique. Elle peut être exploitée par une personne physique ou une société.\n5"},{"n":6,"body":"INTRODUCTION\nArticle 1832 du Code civil\nDes personnes affectent des biens ou leur industrie à une entreprise commune.\nObjectif : partager un bénéfice ou profiter d’une économie.\nLes associés acceptent de contribuer aux pertes.\nLa loi permet aussi, dans certains cas, une société unipersonnelle.\nÀ RETENIR\nL’article 1832 fournit l’ossature du contrat de société.\n6"},{"n":7,"body":"INTRODUCTION\nEntrepreneur individuel et société\nAVANT 2022\nL’activité individuelle exposait en principe un patrimoine unique. La société permettait de loger l’activité dans un patrimoine distinct.\nDEPUIS 2022\nLa loi du 14 février 2022 organise automatiquement une séparation entre patrimoine professionnel et patrimoine personnel de l’entrepreneur individuel.\nÀ RETENIR\nLa société conserve d’autres fonctions : financement, associés, transmission et pérennité.\n7"},{"n":8,"body":"INTRODUCTION\nL’EIRL : une étape intermédiaire\nL’EIRL (2010) permettait l’affectation d’un patrimoine à l’activité.\nLe dispositif est resté peu utilisé par rapport à l’entreprise individuelle.\nLa réforme de 2022 a généralisé une séparation patrimoniale automatique.\n8"},{"n":9,"body":"INTRODUCTION\nLes 3 éléments constitutifs\nAPPORTS\nBiens, argent ou industrie mis à disposition de l’entreprise commune.\nRÉSULTAT\nVocation aux bénéfices ou économies + contribution aux pertes.\nAFFECTIO SOCIETATIS\nVolonté de collaborer à l’entreprise commune sur un pied d’égalité.\nÀ RETENIR\nDeux éléments sont dans l’art. 1832 ; l’affectio societatis est d’origine jurisprudentielle.\n9"},{"n":10,"body":"INTRODUCTION\nClasser les sociétés : pourquoi ?\nIdentifier les règles applicables à la forme sociale.\nComprendre le degré de responsabilité des associés.\nMesurer l’ouverture du capital et les conditions d’entrée ou de sortie.\nToujours vérifier la forme sociale avant de transposer une solution jurisprudentielle.\n10"},{"n":11,"body":"INTRODUCTION\nAvec ou sans personnalité morale\nSOCIÉTÉ IMMATRICULÉE\nPersonnalité morale acquise par l’immatriculation au RCS.\nSANS PERSONNALITÉ\nSociété en participation ou société créée de fait : le contrat existe, mais pas une personne morale autonome.\n11"},{"n":12,"body":"INTRODUCTION\nSociétés civiles / commerciales\nCIVILES\nPrincipe de l’art. 1845 C. civ. : caractère civil sauf attribution d’un autre caractère par la forme, la nature ou l’objet.\nCOMMERCIALES\nCertaines formes sont commerciales par la forme (SARL, SAS, SA), indépendamment de leur activité.\n12"},{"n":13,"body":"INTRODUCTION\nPersonnes / capitaux\nSOCIÉTÉ DE PERSONNES\nIntuitu personae fort, associés souvent responsables des dettes, société fermée.\nSOCIÉTÉ DE CAPITAUX\nL’apport compte davantage que la personne ; responsabilité en principe limitée ; circulation des titres plus aisée.\nÀ RETENIR\nLa SARL est une forme intermédiaire : responsabilité limitée mais agrément des tiers.\n13"},{"n":14,"body":"INTRODUCTION\nSociété fermée / ouverte\nFERMÉE\nEntrée d’un tiers soumise à agrément. Exemple : SARL, art. L.223-14 C. com.\nOUVERTE\nCirculation plus libre des titres ; les sociétés cotées constituent le degré d’ouverture le plus élevé.\n14"},{"n":15,"body":"INTRODUCTION\nSociétés cotées : un autre univers\nL’offre au public et la cotation ajoutent des règles de droit financier.\nLe franchissement de certains seuils peut déclencher une offre publique obligatoire.\nUne jurisprudence concernant une société cotée ne se transpose pas automatiquement à une petite société fermée.\n15"},{"n":16,"body":"INTRODUCTION\nLoi PACTE : intérêt social et enjeux ESG\nArt. 1833 C. civ. : la société est gérée dans son intérêt social.\nLa gestion doit prendre en considération les enjeux sociaux et environnementaux de l’activité.\nLe texte impose une prise en considération, pas une hiérarchie automatique des intérêts.\n16"},{"n":17,"body":"INTRODUCTION\nRaison d’être / société à mission\nRAISON D’ÊTRE — art. 1835\nLes statuts peuvent préciser les principes dont la société se dote et auxquels elle affecte des moyens.\nSOCIÉTÉ À MISSION\nLa société inscrit des objectifs sociaux et environnementaux et organise leur suivi selon le régime légal.\n17"},{"n":18,"body":"Thème 1 — Le contrat de société\nFormation • éléments constitutifs • droit commun des contrats"},{"n":19,"body":"THÈME 1\nUn contrat… mais un contrat original\nHistoriquement, la société repose sur un contrat.\nContrairement à la vente, les parties ne sont pas structurellement dans des camps opposés.\nLa société organise une communauté d’intérêts durable autour d’une entreprise commune.\nÀ RETENIR\nLe contrat de société est un contrat d’organisation, souvent relationnel et de longue durée.\n19"},{"n":20,"body":"THÈME 1\nSociété unipersonnelle\nDepuis 1985, l’art. 1832 al. 2 admet qu’une société soit instituée par la volonté d’une seule personne lorsque la loi le prévoit.\nEURL : SARL à associé unique.\nSASU : SAS à associé unique.\n20"},{"n":21,"body":"THÈME 1\nPlan du thème 1\n1. Les apports.\n2. La vocation aux résultats et les clauses léonines.\n3. L’affectio societatis.\n4. L’application du droit commun des contrats.\n21"},{"n":22,"body":"THÈME 1\nL’apport : la valeur mise à disposition\nL’apport désigne à la fois l’opération et la valeur apportée.\nIl constitue un élément essentiel du contrat de société.\nUn apport fictif ou dépourvu de valeur réelle peut affecter la validité de l’opération.\n22"},{"n":23,"body":"THÈME 1\nTrois formes d’apports\nNUMÉRAIRE\nUne somme d’argent.\nNATURE\nUn bien autre que de l’argent : immeuble, véhicule, brevet, titres…\nINDUSTRIE\nUne activité, un savoir-faire ou un travail mis au service de la société.\n23"},{"n":24,"body":"THÈME 1\nApport ≠ compte courant d’associé\nAPPORT\nCapital à risque. En contrepartie : droits sociaux. L’associé ne peut pas exiger librement la restitution.\nCOMPTE COURANT\nJuridiquement, un prêt consenti par l’associé à la société. Il crée une créance de remboursement.\nÀ RETENIR\nDeux qualités possibles : associé et prêteur — deux relations juridiques distinctes.\n24"},{"n":25,"body":"THÈME 1\nCompte courant : blocage et financement bancaire\nLe banquier peut exiger un financement durable avant d’accorder son prêt.\nSolutions : incorporation au capital ou convention de blocage du compte courant.\nUne décision sociale ne peut pas, à elle seule, transformer le prêt ou en modifier le remboursement sans le consentement du prêteur.\nCass. com., 24 juin 1997 : distinction entre qualité d’associé et qualité de prêteur.\n25"},{"n":26,"body":"THÈME 1\nCapital social : un chiffre statutaire\nAu départ, il correspond principalement aux apports en numéraire et en nature incorporés au capital.\nIl ne doit pas être confondu avec la valeur réelle du patrimoine social.\nLes bénéfices peuvent être distribués, mis en réserve ou incorporés au capital.\n26"},{"n":27,"body":"THÈME 1\nCapital social et pertes\nDans les sociétés à responsabilité limitée, le capital joue un rôle de signal et de discipline financière.\nLa perte d’une fraction importante des capitaux propres déclenche des mécanismes d’alerte et de décision collective.\nCapital social ≠ trésorerie disponible.\n27"},{"n":28,"body":"THÈME 1\nApport en numéraire\nSouscription : engagement d’apporter.\nLibération : versement effectif.\nExemple SARL — art. L.223-7 C. com. : au moins 1/5 à la constitution, solde dans les 5 ans.\n28"},{"n":29,"body":"THÈME 1\nApport en nature : l’enjeu de l’évaluation\nLe bien doit être évalué pour déterminer les droits reçus en contrepartie.\nDans les sociétés de capitaux, l’intervention d’un commissaire aux apports peut être imposée.\nSARL — art. L.223-9 C. com. : évaluation dans les statuts au vu du rapport du commissaire aux apports.\n29"},{"n":30,"body":"THÈME 1\nSurévaluation : responsabilité\nEn SARL, en l’absence de commissaire ou si la valeur retenue diffère de son évaluation, les associés peuvent être solidairement responsables pendant 5 ans de la valeur attribuée.\nDes sanctions pénales peuvent également viser les évaluations frauduleuses.\n30"},{"n":31,"body":"THÈME 1\nPropriété / jouissance\nAPPORT EN PROPRIÉTÉ\nLa propriété du bien est transférée à la société. L’apporteur est garant comme un vendeur.\nAPPORT EN JOUISSANCE\nLa société reçoit seulement la jouissance du bien. L’apporteur est garant comme un bailleur.\nÀ RETENIR\nArt. 1843-3 C. civ.\n31"},{"n":32,"body":"THÈME 1\nApport en industrie\nExemples : savoir-faire, activité professionnelle, compétence créative.\nIl suppose une activité personnelle au service de la société, distincte d’un lien de subordination salarié.\nDifficultés : valorisation, indisponibilité de l’apporteur, cessibilité des droits reçus.\n32"},{"n":33,"body":"THÈME 1\nVocation au résultat : « pour le meilleur et pour le pire »\nPartager le bénéfice ou profiter de l’économie.\nAccepter de contribuer aux pertes.\nLa contribution est en principe proportionnelle aux droits sociaux, sauf aménagement licite.\n33"},{"n":34,"body":"THÈME 1\nSociété, association, GIE\nSOCIÉTÉ\nBénéfice ou économie + contribution aux pertes.\nASSOCIATION\nBut autre que le partage de bénéfices entre les membres.\nGIE\nFaciliter ou développer l’activité économique de ses membres ; activité auxiliaire, sans bénéfice pour lui-même.\n34"},{"n":35,"body":"THÈME 1\nClauses léonines — art. 1844-1\nEst réputée non écrite la clause qui attribue à un associé la totalité du profit.\nMême sanction si un associé est totalement exonéré des pertes.\nMême sanction si un associé est totalement exclu du profit ou supporte toutes les pertes.\nÀ RETENIR\nLa sanction frappe la clause, pas nécessairement tout le contrat de société.\n35"},{"n":36,"body":"THÈME 1\nRépartition inégale : possible\nLa règle proportionnelle de l’art. 1844-1 est supplétive.\nLes statuts peuvent organiser une répartition différente.\nLa limite : ne pas tomber dans l’une des exclusions totales prohibées.\n36"},{"n":37,"body":"THÈME 1\nClauses léonines : la durée compte\nCass. com., 13 févr. 1996 : renonciation au dividende d’un exercice clos admise.\nCE, 18 oct. 2022 : une répartition très déséquilibrée mais limitée dans le temps peut échapper à la prohibition.\nL’analyse porte donc aussi sur la portée et la durée du mécanisme.\n37"},{"n":38,"body":"THÈME 1\nPromesses de rachat et risque social\nLa jurisprudence a successivement raisonné sur l’objet de la promesse, l’équilibre des engagements et la durée d’exposition au risque.\nL’arrêt de 2023 présenté dans le cours marque un retour à une lecture favorable à la promesse de rachat, distincte du pacte social.\n38"},{"n":39,"body":"THÈME 1\nAffectio societatis : définition\nNotion jurisprudentielle, absente du texte de l’art. 1832.\nCass. com., 3 juin 1986 : collaboration effective à l’exploitation, dans un intérêt commun et sur un pied d’égalité.\nC’est surtout un outil de qualification lorsque la réalité de la société est discutée.\n39"},{"n":40,"body":"THÈME 1\nAffectio societatis : 3 usages\nReconnaître une société lorsque rien n’a été formalisé.\nIdentifier une société fictive ou une relation qui ne correspond pas à une véritable collaboration sociétaire.\nApprécier une mésentente pouvant conduire à la dissolution si elle paralyse le fonctionnement social.\n40"},{"n":41,"body":"THÈME 1\nMésentente et dissolution — art. 1844-7, 5°\nLa seule mésentente ne suffit pas.\nIl faut une paralysie du fonctionnement de la société.\nEn pratique, les statuts peuvent prévoir des mécanismes de sortie ou de déblocage pour éviter la dissolution.\n41"},{"n":42,"body":"THÈME 1\nAffectio societatis en cours de vie sociale\nCass. com., 11 juin 2013 : celui qui devient associé en cours de vie sociale n’a pas à démontrer spécialement son affectio societatis.\nLa notion reste utile, mais son rôle est aujourd’hui plus circonscrit.\n42"},{"n":43,"body":"Thème 1 — Droit commun des contrats\nNégociation • consentement • capacité • contenu"},{"n":44,"body":"THÈME 1\nAvant le contrat : la phase précontractuelle\nLa constitution d’une société est souvent précédée de négociations longues.\nLettres d’intention, protocoles, promesses ou structures préparatoires peuvent organiser cette phase.\nCes actes ne sont pas nécessairement eux-mêmes des contrats de société.\n44"},{"n":45,"body":"THÈME 1\nPromesse de société\nElle prépare la constitution future de la société.\nComme toute promesse, elle doit être analysée selon le droit commun des contrats et son contenu précis.\nIl faut distinguer l’engagement de négocier de l’engagement ferme de constituer la société.\n45"},{"n":46,"body":"THÈME 1\nConditions de validité du contrat de société\nConsentement libre et éclairé.\nCapacité des associés.\nContenu licite et certain.\nÀ ces conditions générales s’ajoutent les éléments spécifiques du contrat de société.\n46"},{"n":47,"body":"THÈME 1\nConsentement et vices\nErreur, dol et violence peuvent affecter le consentement.\nLe droit des sociétés limite toutefois certaines causes de nullité afin de préserver la stabilité de la personne morale et des relations avec les tiers.\nToujours distinguer vice du contrat et sanction réellement ouverte.\n47"},{"n":48,"body":"THÈME 1\nCapacité\nPrincipe : toute personne capable peut devenir associée.\nDes règles de protection s’appliquent aux mineurs et majeurs protégés.\nCertaines formes imposent des exigences particulières : dans la SNC, les associés ont la qualité de commerçant.\n48"},{"n":49,"body":"THÈME 1\nObjet social et contenu licite\nL’objet social définit l’activité que la société se propose d’exercer.\nIl doit être licite et suffisamment déterminé.\nIl permet aussi d’identifier les agréments ou autorisations nécessaires à certaines activités réglementées.\n49"},{"n":50,"body":"Thème 2 — La société, personne morale\nCapacité • patrimoine • identité • naissance"},{"n":51,"body":"THÈME 2\nPersonnalité morale : l’idée centrale\nLa société immatriculée devient un sujet de droit autonome.\nElle est distincte de ses associés et de ses dirigeants.\nElle peut être titulaire de droits, contracter, agir en justice et être débitrice d’obligations.\n51"},{"n":52,"body":"THÈME 2\nDeux effets essentiels\nCAPACITÉ JURIDIQUE\nLa société devient titulaire de droits et d’obligations et agit par ses organes.\nPATRIMOINE PROPRE\nActif et passif sociaux sont distincts des patrimoines des associés.\n52"},{"n":53,"body":"THÈME 2\nAutonomie patrimoniale\nLes biens de la société n’appartiennent pas aux associés.\nLes patrimoines de sociétés d’un même groupe restent juridiquement distincts.\nLes flux entre sociétés doivent avoir un fondement juridique et comptable.\n53"},{"n":54,"body":"THÈME 2\nResponsabilité pénale de la personne morale\nArt. 121-2 C. pén. : les personnes morales, sauf l’État, peuvent être pénalement responsables des infractions commises pour leur compte par leurs organes ou représentants.\nLa responsabilité de la personne morale n’exclut pas nécessairement celle des personnes physiques.\n54"},{"n":55,"body":"THÈME 2\nDénomination sociale\nLa personne morale doit pouvoir être identifiée.\nLa dénomination sociale est choisie dans les statuts, sous réserve des droits antérieurs et des règles applicables.\nElle se distingue du nom commercial, de l’enseigne et des marques.\n55"},{"n":56,"body":"THÈME 2\nSiège social\nLe siège rattache juridiquement la société à un lieu.\nIl détermine notamment certaines compétences territoriales et participe à la détermination de la loi applicable.\nLe siège statutaire doit correspondre à une réalité juridique suffisante.\n56"},{"n":57,"body":"THÈME 2\nNationalité et loi applicable\nLa société est rattachée à un ordre juridique.\nDans l’Union européenne, la liberté d’établissement a profondément facilité les mobilités et transformations transfrontalières.\nIl faut distinguer siège statutaire, siège réel et activité économique.\n57"},{"n":58,"body":"THÈME 2\nMobilité des sociétés en Europe\nLa jurisprudence européenne puis les textes ont favorisé la reconnaissance et la mobilité des sociétés dans l’Union.\nLa directive de 2019 a organisé les transformations, fusions et scissions transfrontalières.\nLa société européenne constitue une forme supranationale spécifique.\n58"},{"n":59,"body":"THÈME 2\nDurée de la société\nLes statuts fixent la durée de la société, dans la limite légale.\nÀ l’arrivée du terme, la société est en principe dissoute si elle n’a pas été prorogée.\nLa prorogation doit être anticipée par les associés.\n59"},{"n":60,"body":"THÈME 2\nOubli de prorogation : mécanisme de rattrapage\nLe législateur a prévu un mécanisme permettant, sous conditions, de régulariser l’absence de consultation préalable.\nCass., 30 août 2023, n° 22-12.084 : première application présentée dans le cours.\nLa régularisation évite qu’un simple oubli entraîne mécaniquement la disparition de la société.\n60"},{"n":61,"body":"THÈME 2\nQuand naît la personnalité morale ?\nPour les sociétés, l’acquisition de la personnalité morale est liée à l’immatriculation au RCS.\nLe greffier contrôle la régularité de la demande.\nAvant l’immatriculation, la société ne peut pas encore être titulaire elle-même des actes conclus pour son futur compte.\n61"},{"n":62,"body":"THÈME 2\nImmatriculation : rôle du greffier\nLe dossier de constitution est contrôlé avant immatriculation.\nLes irrégularités ou pièces manquantes donnent lieu à demande de régularisation.\nL’immatriculation constitue le point de bascule vers la personnalité morale.\n62"},{"n":63,"body":"La société en formation\nComment agir avant l’immatriculation ?"},{"n":64,"body":"THÈME 2\nLe problème pratique\nIl faut souvent louer un local, acheter du matériel ou conclure des contrats avant l’immatriculation.\nMais la future société n’a pas encore la personnalité morale.\nLe droit organise donc un mécanisme de reprise des actes.\n64"},{"n":65,"body":"THÈME 2\nPrincipe — art. L.210-6 C. com.\nLes personnes qui agissent au nom d’une société en formation sont personnellement tenues des actes accomplis.\nAprès immatriculation, la société peut reprendre les engagements selon les modalités prévues.\nLa reprise fait alors produire l’acte à la société.\n65"},{"n":66,"body":"THÈME 2\nPremière condition : une véritable société en formation\nLa phase de formation doit être identifiable.\nIl faut distinguer les actes préparatoires de l’exploitation déjà commencée comme si la société existait.\nLa qualification dépend des circonstances concrètes.\n66"},{"n":67,"body":"THÈME 2\nActe conclu pour la société en formation\nL’ancienne jurisprudence exigeait un formalisme très strict : l’acte devait être conclu « au nom » ou « pour le compte » de la société en formation.\nCette exigence pouvait conduire à la nullité lorsque la formule était imparfaite.\n67"},{"n":68,"body":"THÈME 2\nRevirement de novembre 2023\nTrois arrêts de la chambre commerciale (n° 22-12.865, 22-21.623 et 22-18.295) abandonnent l’exigence formaliste absolue.\nLe juge peut rechercher, dans les circonstances intrinsèques et extrinsèques, la commune intention de conclure pour la société en formation.\nEn pratique : mieux vaut toujours rédiger expressément la clause.\n68"},{"n":69,"body":"THÈME 2\nLes 3 modalités classiques de reprise\nÉtat des actes annexé aux statuts : reprise lors de l’immatriculation.\nMandat donné avant l’immatriculation pour conclure certains actes déterminés.\nDécision des associés après immatriculation reprenant l’acte.\n69"},{"n":70,"body":"THÈME 2\nEffet de la reprise\nSi les conditions sont réunies, l’acte est réputé avoir été souscrit dès l’origine par la société.\nÀ défaut de reprise, la personne qui a contracté reste personnellement engagée.\nLa question de la reprise est donc décisive pour identifier le débiteur.\n70"},{"n":71,"body":"Sociétés sans personnalité morale\nSociété en participation • société créée de fait"},{"n":72,"body":"THÈME 2\nSociété en participation\nLes associés choisissent de ne pas immatriculer la société.\nLe contrat de société existe, mais aucune personne morale nouvelle ne naît.\nLe régime est largement contractuel et échappe à de nombreuses règles attachées aux formes sociales immatriculées.\n72"},{"n":73,"body":"THÈME 2\nBiens et société en participation — art. 1872\nÀ l’égard des tiers, chaque associé reste en principe propriétaire des biens qu’il met à disposition.\nCertains biens peuvent être réputés indivis entre les associés.\nL’absence de patrimoine social autonome est une conséquence majeure de l’absence de personnalité morale.\n73"},{"n":74,"body":"THÈME 2\nOcculte / ostensible\nOCCULTE\nLes tiers ignorent l’existence de la société en participation.\nOSTENSIBLE\nL’existence du groupement est révélée ; l’immixtion ou l’apparence peut conduire d’autres associés à être engagés envers les tiers.\n74"},{"n":75,"body":"THÈME 2\nSociété créée de fait\nArt. 1873 C. civ. : les règles de la société en participation lui sont applicables.\nElle n’est pas voulue/formalisée comme telle : le juge la reconnaît à partir du comportement des parties.\nExemples classiques : concubins exploitant ensemble une activité, collaboration économique informelle.\n75"},{"n":76,"body":"THÈME 2\nComment la prouver ?\nEn principe : apport + vocation aux résultats + affectio societatis.\nPour les tiers, la jurisprudence peut raisonner à partir de l’apparence du groupement.\nCass. 2e civ., 22 mai 2008 : approche plus souple pour le tiers invoquant l’apparence d’une société créée de fait.\n76"},{"n":77,"body":"Nullités et sanctions\nLe droit des sociétés privilégie la stabilité et la régularisation"},{"n":78,"body":"THÈME 2\nLa nullité n’est pas la seule sanction\nInopposabilité : l’acte reste valable mais ne produit pas d’effet contre certaines personnes.\nResponsabilité civile : réparation du dommage causé par l’irrégularité.\nSanctions pénales : certains manquements restent spécialement incriminés.\nClause réputée non écrite : seule la stipulation disparaît.\n78"},{"n":79,"body":"THÈME 2\nNullité de la société : régime spécial\nLe droit des sociétés déroge fortement au droit commun.\nArt. 1844-10 C. civ. et dispositions du Code de commerce limitent les causes de nullité.\nObjectif : protéger la stabilité de la société et la sécurité des tiers.\n79"},{"n":80,"body":"THÈME 2\nSociétés commerciales et droit européen\nLe droit européen a limité les causes de nullité des SARL et sociétés par actions.\nLes vices de consentement ou incapacités ne conduisent pas toujours à la nullité de la société.\nLe raisonnement doit toujours partir du texte applicable à la forme sociale concernée.\n80"},{"n":81,"body":"THÈME 2\nSAS : violation des statuts et nullité\nArt. L.227-9 C. com. donne aux statuts un rôle central dans l’organisation des décisions collectives.\nCass. com., 15 mars 2023 : revirement présenté dans le cours ; une violation statutaire peut entraîner la nullité lorsqu’elle a pu influer sur le résultat du processus de décision.\nLa seule irrégularité formelle ne suffit donc pas nécessairement.\n81"},{"n":82,"body":"THÈME 2\nProtection des tiers de bonne foi\nArt. 1844-16 C. civ. : la société et les associés ne peuvent en principe opposer la nullité aux tiers de bonne foi.\nException notamment pour l’incapable ou l’associé victime d’un vice du consentement dans les conditions du texte.\n82"},{"n":83,"body":"THÈME 2\nLa régularisation — art. 1844-11\nL’action en nullité s’éteint si sa cause a cessé d’exister lorsque le tribunal statue au fond en première instance.\nException : illicéité de l’objet social.\nLe droit des sociétés préfère souvent sauver la société plutôt que l’anéantir.\nÀ RETENIR\nRéflexe : avant de conclure à la nullité, rechercher une régularisation possible.\n83"},{"n":84,"body":"Synthèse\nLes réflexes à conserver pour l’examen"},{"n":85,"body":"SYNTHÈSE\nMéthode : 7 questions\n1. Existe-t-il un contrat de société ?\n2. Les 3 éléments sont-ils réunis ?\n3. Quelle est la forme sociale et sa classification ?\n4. La société a-t-elle la personnalité morale ?\n5. Qui est engagé par l’acte litigieux ?\n6. Quelle irrégularité est caractérisée ?\n7. Quelle sanction est réellement prévue : nullité, inopposabilité, responsabilité ou régularisation ?\n85"},{"n":86,"body":"SYNTHÈSE\nLes textes pivots à connaître\nArt. 1832 : définition de la société.\nArt. 1844-1 : bénéfices, pertes et clauses léonines.\nArt. 1844-7 : causes de dissolution.\nArt. 1844-10 s. : nullités et régularisation.\nArt. 1871 s. : société en participation / créée de fait.\nArt. L.210-6 C. com. : société en formation.\nÀ RETENIR\nL’objectif n’est pas de réciter : il faut savoir rattacher chaque difficulté au bon mécanisme.\n86"}]}</script>
<script>
'use strict';
const DB=JSON.parse(document.getElementById('study-data').textContent);
const $=(s,el=document)=>el.querySelector(s), $$=(s,el=document)=>[...el.querySelectorAll(s)];
const e=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
const ico=(name,size='')=>`<svg class="ico"${size?' style="width:'+size+'px;height:'+size+'px"':''}><use href="#i-${name}"/></svg>`;
function load(){try{return JSON.parse(localStorage.getItem('juris-v1')||'{}')}catch{return {}}}
const store=Object.assign({done:{},caseAnswers:{},caseReviewed:{},caseNotes:{},quizResults:[],flashKnown:{},examAnswers:{},theme:'light'},load());
const persist=()=>{try{localStorage.setItem('juris-v1',JSON.stringify(store))}catch{}};
const ui={route:'dashboard',id:null,filter:'all',sort:'base',query:'',caseLevel:'all',caseTopic:'all',courseGroup:'all',caseShow:false,caseHint:false,caseCheck:false,quiz:null,flashIndex:0,flashReveal:false,flashTopic:'all',examReveal:false,slideFilter:'',timerSince:0,timerElapsed:0,timerRunning:false};
function toast(msg){let el=$('#toast');el.textContent=msg;el.style.opacity='1';clearTimeout(toast._t);toast._t=setTimeout(()=>el.style.opacity='0',2350)}
function go(route,id=''){ui.route=route;ui.id=id;ui.caseShow=false;ui.caseHint=false;ui.caseCheck=false;ui.timerRunning=false;ui.timerElapsed=0;ui.timerSince=0;window.location.hash=route+(id?'/'+id:'');render();window.scrollTo({top:0,behavior:'instant'});$('#sidebar').classList.remove('open')}
const NAV_MAIN=[['dashboard','Tableau de bord','grid'],['courses','Cours complets','book'],['cases','Études de cas','scale'],['method','Méthodologie','list']];
const NAV_STUDY=[['quiz','Quiz interactifs','check'],['flash','Flashcards','flash'],['exam','Examen blanc','graduation']];
const NAV_EXTRA=[['compare','Comparateur de sociétés','columns'],['lexicon','Lexique','book'],['sources','Sources & articles','file']];
function renderNav(){function group(items){return items.map(([id,label,icon])=>`<button class="nav-item ${ui.route===id?'active':''}" data-action="nav" data-id="${id}">${ico(icon)}<span>${label}</span>${id==='courses'?`<span class="n-count">${DB.modules.length}</span>`:id==='cases'?`<span class="n-count">${DB.cases.length}</span>`:''}</button>`).join('')};$('#nav-main').innerHTML=group(NAV_MAIN);$('#nav-study').innerHTML=group(NAV_STUDY);$('#nav-extra').innerHTML=group(NAV_EXTRA);let n=Object.keys(store.done).filter(k=>store.done[k]).length,p=Math.round(n/DB.modules.length*100);$('#sidePct').textContent=p+' %';$('#sideCount').textContent=n+' / '+DB.modules.length+' chapitres terminés';$('#sideBar').style.width=p+'%';const labels={dashboard:'Tableau de bord',courses:'Cours complets',lesson:'Chapitre',cases:'Études de cas',case:'Cas pratique',method:'Méthodologie',quiz:'Quiz',flash:'Flashcards',exam:'Examen blanc',compare:'Comparateur',lexicon:'Lexique',sources:'Sources',search:'Recherche'};$('#crumb').textContent=labels[ui.route]||'Révisions';$('#themeBtn').innerHTML=ico(store.theme==='dark'?'sun':'moon');document.body.classList.toggle('dark',store.theme==='dark')}
function ptitle(kicker,title,sub){return `<div class="eyebrow">${e(kicker)}</div><h1 class="page-title">${e(title)}</h1><p class="page-sub">${e(sub)}</p>`}
function cardCourse(m){let done=!!store.done[m.id];return `<article class="card clickable course-card" data-action="lesson" data-id="${m.id}"><div class="topline"><span class="chip">${e(m.group)}</span>${done?`<span class="chip green">${ico('check',12)} Terminé</span>`:`<span class="chip ${m.priority===3?'amber':''}">${m.priority===3?'Essentiel':'À connaître'}</span>`}</div><h3 class="card-title">${e(m.title)}</h3><p class="card-desc">${e(m.subtitle)}</p><div class="card-footer"><span class="muted small">${ico('clock',12)} ${m.minutes} min · ${m.sections.length} sections</span><span style="color:var(--brand)">${ico('arrow',17)}</span></div></article>`}
function cardCase(c){let reviewed=!!store.caseReviewed[c.id], drafted=!!store.caseAnswers[c.id];return `<article class="card clickable case-card" data-action="case" data-id="${c.id}"><div class="topline"><span class="chip ${c.level==='Avancé'?'amber':c.level==='Débutant'?'green':'blue'}">${e(c.level)}</span><span class="muted tiny">${c.minutes} min</span></div><h3 class="card-title">${e(c.title)}</h3><p class="card-desc">${e(c.questions)}</p><div class="card-footer"><span class="chip">${e(DB.modules.find(m=>m.id===c.topic)?.title||'Cas pratique').slice(0,38)}</span>${reviewed?'<span class="chip green">Corrigé</span>':drafted?'<span class="chip blue">Brouillon</span>':ico('arrow',17)}</div></article>`}
function renderDashboard(){let done=Object.values(store.done).filter(Boolean).length,pr=Math.round(done/DB.modules.length*100),reviewed=Object.values(store.caseReviewed).filter(Boolean).length,avg=store.quizResults.length?Math.round(store.quizResults.reduce((a,v)=>a+v.percent,0)/store.quizResults.length):null;return `<section class="hero"><div class="eyebrow">KEDGE Business School · Droit des sociétés</div><h1>Comprendre les règles.<br>Maîtriser les cas pratiques.</h1><p>Une plateforme de révision fondée sur tes supports, construite pour préparer une évaluation par études de cas. Cours, méthodes, entraînements et corrections au même endroit.</p><div class="rowbuttons"><button class="btn light" data-action="nav" data-id="courses">Reprendre les cours ${ico('arrow',15)}</button><button class="btn" style="background:#ffffff1a;color:white;border-color:#ffffff35" data-action="nav" data-id="cases">S'entraîner sur un cas</button></div></section>
<div class="grid three mt-3"><div class="card metric"><div class="subicon">${ico('book')}</div><strong>${pr} %</strong><div class="metric-label">Cours terminés</div><div class="progress-track mt-1" style="background:var(--line)"><div class="progress-fill" style="width:${pr}%;background:var(--brand)"></div></div><div class="mini-note mt-1">${done} sur ${DB.modules.length} chapitres</div></div><div class="card metric"><div class="subicon green">${ico('scale')}</div><strong>${reviewed}<span style="font-size:16px;color:var(--muted)"> / ${DB.cases.length}</span></strong><div class="metric-label">Études de cas corrigées</div><div class="mini-note mt-1">Exercices avec raisonnement complet</div></div><div class="card metric"><div class="subicon amber">${ico('graduation')}</div><strong>${avg===null?'—':avg+' %'}</strong><div class="metric-label">Score moyen aux quiz</div><div class="mini-note mt-1">${store.quizResults.length} session${store.quizResults.length!==1?'s':''} enregistrée${store.quizResults.length!==1?'s':''}</div></div></div>
<div class="section-head"><h2 class="section-title">Ton parcours de révision</h2><button class="btn outline sm" data-action="nav" data-id="method">Voir la méthodologie ${ico('arrow',13)}</button></div><div class="grid three"><div class="card clickable" data-action="nav" data-id="courses"><div class="subicon">${ico('book')}</div><h3 class="card-title">01. Maîtriser le cours</h3><p class="card-desc">Comprends les principes, les distinctions et les articles essentiels grâce aux fiches structurées.</p><div class="card-footer"><span class="chip">${DB.modules.length} chapitres</span>${ico('arrow')}</div></div><div class="card clickable" data-action="nav" data-id="cases"><div class="subicon green">${ico('scale')}</div><h3 class="card-title">02. Savoir raisonner</h3><p class="card-desc">Rédige tes réponses et confronte-les à un corrigé argumenté, sans te précipiter sur la solution.</p><div class="card-footer"><span class="chip">${DB.cases.length} cas</span>${ico('arrow')}</div></div><div class="card clickable" data-action="nav" data-id="exam"><div class="subicon amber">${ico('graduation')}</div><h3 class="card-title">03. Se mettre en condition</h3><p class="card-desc">Teste-toi sur un examen blanc, avec plusieurs problèmes à résoudre et une grille d'auto-évaluation.</p><div class="card-footer"><span class="chip">Mode examen</span>${ico('arrow')}</div></div></div>
<div class="section-head"><h2 class="section-title">Priorité examen : les mécanismes clés</h2><button class="btn outline sm" data-action="nav" data-id="courses">Tous les cours</button></div><div class="grid three">${['formation','nullites','resultats'].map(id=>cardCourse(DB.modules.find(x=>x.id===id))).join('')}</div>
<div class="callout warn mt-3">${ico('alert',22)}<div><strong>Point de vigilance : réforme des nullités du 1er octobre 2025</strong><p>Certains documents et passages de cours antérieurs à cette date ne reflètent pas tous les nouveaux articles. Le chapitre « Nullités et sanctions » contient un encadré actualisé avec les articles 1844-10, 1844-10-1 et 1844-12-1, vérifiés sur Légifrance en novembre 2026.</p><button class="btn outline sm mt-1" data-action="lesson" data-id="nullites">Voir les nouvelles règles</button></div></div>
<div class="section-head"><h2 class="section-title">Le réflexe du cas pratique</h2><button class="btn outline sm" data-action="nav" data-id="method">La méthode complète</button></div><div class="mini-grid"><div class="mini-step"><div class="number">01</div><b>Qualifier les faits</b><p>Qui ? Quelle forme ? Quel acte ? Quelle date ?</p></div><div class="mini-step"><div class="number">02</div><b>Appliquer la règle</b><p>Texte applicable, conditions, exceptions et raisonnement.</p></div><div class="mini-step"><div class="number">03</div><b>Conclure précisément</b><p>Conséquence juridique exacte, avec une réserve si un fait manque.</p></div></div>`}
function renderCourses(){let q=ui.query.toLowerCase().trim();let groups=['all',...new Set(DB.modules.map(m=>m.group))];let arr=DB.modules.filter(m=>(ui.courseGroup==='all'||m.group===ui.courseGroup)&&(!q||(m.title+' '+m.subtitle+' '+m.lead+' '+m.sections.map(s=>s.p+' '+s.h).join(' ')).toLowerCase().includes(q)));if(ui.sort==='priority')arr.sort((a,b)=>b.priority-a.priority);return ptitle('Bibliothèque pédagogique','Cours complets','20 chapitres détaillés, rédigés à partir de tes 11 documents et enrichis de repères réglementaires datés.')+`<div class="toolbar"><input class="input searchbox" id="courseSearch" placeholder="Rechercher dans les chapitres…" value="${e(ui.query)}"><select class="select" id="courseGroup">${groups.map(g=>`<option value="${e(g)}" ${ui.courseGroup===g?'selected':''}>${g==='all'?'Tous les thèmes':e(g)}</option>`).join('')}</select><select class="select" id="courseSort"><option value="base" ${ui.sort==='base'?'selected':''}>Ordre pédagogique</option><option value="priority" ${ui.sort==='priority'?'selected':''}>Priorité examen</option></select><span class="count">${arr.length} chapitre${arr.length!==1?'s':''}</span></div><div class="grid three">${arr.map(cardCourse).join('')||'<div class="card">Aucun résultat. Modifie ta recherche.</div>'}</div>`}
function renderLesson(){let m=DB.modules.find(x=>x.id===ui.id);if(!m)return renderCourses();return `<div class="detail-top"><button class="backlink" data-action="nav" data-id="courses">← Tous les cours</button><div class="rowbuttons"><button class="btn outline sm" data-action="print">${ico('file',14)} Imprimer</button><button class="btn ${store.done[m.id]?'ghost':'primary'} sm" data-action="done" data-id="${m.id}">${ico('check',14)} ${store.done[m.id]?'Marqué comme terminé':'Marquer comme terminé'}</button></div></div><div class="detail-grid"><div><div class="lesson-hero"><div class="rowbuttons"><span class="chip blue">${e(m.group)}</span><span class="chip">${m.minutes} min de lecture</span>${m.priority===3?'<span class="chip amber">Priorité examen</span>':''}</div><h1>${e(m.title)}</h1><p>${e(m.subtitle)}</p><p style="margin-top:18px;color:var(--ink);line-height:1.75">${e(m.lead)}</p></div><div class="takeaway"><h3>À savoir absolument</h3><ul>${m.points.map(v=>`<li>${e(v)}</li>`).join('')}</ul></div>${m.sections.map((s,i)=>`<section class="prose-card" id="section${i}"><div class="eyebrow">Point ${String(i+1).padStart(2,'0')}</div><h3>${e(s.h)}</h3><p>${e(s.p)}</p>${s.items.length?`<ul>${s.items.map(v=>`<li>${e(v)}</li>`).join('')}</ul>`:''}${s.ex?`<div class="fine-box"><b>Exemple concret</b>${e(s.ex)}</div>`:''}${s.trap?`<div class="fine-box danger"><b>Piège à éviter</b>${e(s.trap)}</div>`:''}${s.art?`<div class="legal-tag">${e(s.art)}</div>`:''}</section>`).join('')}<div class="callout info mt-3">${ico('graduation',20)}<div><strong>Valide ce chapitre en pratique</strong><p>Ne t'arrête pas à la lecture. Teste le raisonnement sur un cas, sans regarder la correction au départ.</p><button class="btn ghost sm mt-1" data-action="case" data-id="${DB.cases.find(c=>c.topic===m.id)?.id||'c22'}">Ouvrir un cas associé ${ico('arrow',13)}</button></div></div></div><aside class="toc"><h4>Dans ce chapitre</h4>${m.sections.map((s,i)=>`<button data-action="anchor" data-id="section${i}">${i+1}. ${e(s.h)}</button>`).join('')}<div class="divider"></div><h4>Supports mobilisés</h4>${m.refs.map(s=>`<p class="tiny muted" style="margin:8px 0">${e(s)}</p>`).join('')}<button class="btn outline sm mt-2" data-action="nav" data-id="sources">Toutes les sources</button></aside></div>`}
function renderCases(){let q=ui.query.toLowerCase().trim();let topics=['all',...new Set(DB.cases.map(x=>x.topic))];let arr=DB.cases.filter(c=>(ui.caseLevel==='all'||c.level===ui.caseLevel)&&(ui.caseTopic==='all'||c.topic===ui.caseTopic)&&(!q||(c.title+' '+c.facts+' '+c.questions).toLowerCase().includes(q)));return ptitle('Atelier de raisonnement','Études de cas','22 situations originales, de difficulté progressive. Rédige une vraie réponse juridique avant de consulter le corrigé.')+`<div class="toolbar"><input class="input searchbox" id="caseSearch" value="${e(ui.query)}" placeholder="Rechercher un cas ou une notion…"><select class="select" id="caseLevel"><option value="all">Toutes difficultés</option>${['Débutant','Intermédiaire','Avancé'].map(x=>`<option value="${e(x)}" ${ui.caseLevel===x?'selected':''}>${e(x)}</option>`).join('')}</select><select class="select" id="caseTopic"><option value="all">Tous les thèmes</option>${topics.slice(1).map(x=>`<option value="${e(x)}" ${ui.caseTopic===x?'selected':''}>${e(DB.modules.find(m=>m.id===x)?.title||x)}</option>`).join('')}</select><span class="count">${arr.length} cas</span></div><div class="callout info mb-1">${ico('scale',20)}<div><strong>Comment t'entraîner efficacement</strong><p>1. Identifie les problèmes de droit. 2. Écris la règle. 3. Applique-la aux faits précis. 4. Conclus. Ensuite, ouvre les indices, compare ton travail au corrigé et coche les éléments réellement présents dans ta copie. L'estimation automatique par mots-clés n'est pas une notation juridique.</p></div></div><div class="grid three mt-3">${arr.map(cardCase).join('')||'<div class="card">Aucun cas trouvé.</div>'}</div>`}
function renderCase(){let c=DB.cases.find(x=>x.id===ui.id);if(!c)return renderCases();let ans=store.caseAnswers[c.id]||'';return `<div class="detail-top"><button class="backlink" data-action="nav" data-id="cases">← Toutes les études de cas</button><div class="rowbuttons"><span class="timer" id="timerLabel">00:00</span><button class="btn outline sm" data-action="timer" id="timerBtn">${ico('clock',13)} Lancer le chrono</button></div></div><div class="lesson-hero"><div class="case-meta"><span class="chip ${c.level==='Avancé'?'amber':'blue'}">${e(c.level)}</span><span class="chip">${c.minutes} min conseillées</span><span class="chip">${e(DB.modules.find(m=>m.id===c.topic)?.group||'Cours')}</span></div><h1>${e(c.title)}</h1><p>Cas pratique n° ${e(c.id.slice(1).padStart(2,'0'))}</p></div><div class="grid two mt-2" style="align-items:start"><div class="card"><div class="eyebrow">ÉNONCÉ</div><h3 style="margin:8px 0 12px;font-size:17px">Les faits</h3><div class="case-facts">${e(c.facts)}</div><div class="divider mt-2"></div><div class="eyebrow mt-2">TRAVAIL DEMANDÉ</div><p class="case-questions">${e(c.questions)}</p><button class="btn outline sm mt-2" data-action="hint">${ui.caseHint?'Masquer les indices':'Afficher les problèmes à identifier'} ${ico('chevron',12)}</button>${ui.caseHint?`<div class="fine-box mt-1"><b>Problèmes juridiques à envisager</b><ul>${c.issues.map(t=>`<li>${e(t)}</li>`).join('')}</ul></div>`:''}<div class="fine-box danger"><b>Attention</b>${e(c.trap)}</div></div><div class="card case-writing"><div class="eyebrow">TA COPIE</div><h3 style="margin:8px 0 12px;font-size:17px">Rédige ta solution</h3><p class="small muted">Structure conseillée : qualification des faits · problème de droit · règle (majeure) · application (mineure) · conclusion.</p><textarea class="textarea" id="caseAnswer" placeholder="En l'espèce, ...\n\nEn droit, selon l'article ...\n\nOr, dans la situation donnée, ...\n\nPar conséquent, ...">${e(ans)}</textarea><div class="card-footer"><span class="muted tiny" id="wordCount">${ans.trim()?ans.trim().split(/\s+/).length:0} mots · sauvegarde locale</span><div class="rowbuttons"><button class="btn outline sm" data-action="saveCase">Enregistrer</button><button class="btn ghost sm" data-action="analysis">Vérifier la couverture</button></div></div></div></div>${ui.caseCheck?renderCaseAnalysis(c,ans):''}<div class="callout info mt-2">${ico('check',20)}<div><strong>Corrigé disponible après ta tentative</strong><p>Le corrigé détaille les problèmes, les règles, l'application aux faits et la conclusion. Il ne doit pas remplacer ton propre raisonnement.</p><button class="btn primary sm mt-1" data-action="revealCase">${ui.caseShow?'Masquer le corrigé':'Afficher le corrigé complet'}</button></div></div>${ui.caseShow?`<section class="case-correction" id="correction"><h2 class="section-title">Corrigé juridique détaillé</h2><div class="corr-step"><div class="eyebrow">ÉTAPE 1 — QUALIFICATION & PROBLÈME DE DROIT</div><h4>Identifier les questions posées</h4><ul>${c.issues.map(x=>`<li>${e(x)}</li>`).join('')}</ul></div><div class="corr-step"><div class="eyebrow">ÉTAPE 2 — MAJEURE</div><h4>Les règles de droit pertinentes</h4><ul>${c.rules.map(x=>`<li>${e(x)}</li>`).join('')}</ul></div><div class="corr-step"><div class="eyebrow">ÉTAPE 3 — MINEURE</div><h4>Application des règles aux faits</h4>${c.application.map(x=>`<p>${e(x)}</p>`).join('')}</div><div class="corr-step"><div class="eyebrow">ÉTAPE 4 — CONCLUSION</div><h4>La solution juridiquement défendable</h4>${c.conclusion.map(x=>`<p>${e(x)}</p>`).join('')}</div><div class="self-check"><h3 class="mt-0">Auto-évaluation de ta copie</h3><p class="muted small">Coche uniquement les éléments réellement argumentés dans ce que tu as rédigé. Cette grille est indicative et ne remplace pas la correction du professeur.</p>${c.checklist.map((w,i)=>`<label class="checkitem"><input type="checkbox" data-self="${i}" ${store.caseNotes[c.id]?.includes(i)?'checked':''}><span>J'ai traité : <strong>${e(w)}</strong></span></label>`).join('')}<div class="coverage"><span class="small" id="selfScore">${Math.round((store.caseNotes[c.id]?.length||0)/c.checklist.length*100)} % des points cochés</span><div class="progress-track"><div class="progress-fill" id="selfBar" style="width:${Math.round((store.caseNotes[c.id]?.length||0)/c.checklist.length*100)}%"></div></div></div><button class="btn ${store.caseReviewed[c.id]?'ghost':'primary'} sm" data-action="reviewCase">${store.caseReviewed[c.id]?'Cas déjà corrigé':'Marquer comme cas corrigé'} ${ico('check',14)}</button></div></section>`:''}`}
function renderCaseAnalysis(c,ans){let text=ans.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');let keys=c.checklist.map(x=>x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));let found=keys.filter(k=>k.split(/\s+/).some(word=>word.length>=4&&text.includes(word))).length,percent=Math.round(found/keys.length*100);return `<div class="callout warn mt-2">${ico('alert',20)}<div><strong>Indicateur de mots-clés : ${percent} % des thèmes repérés</strong><p>Analyse locale très approximative : ${found} thème(s) sur ${keys.length} ont des termes présents dans ta rédaction. Cela ne vérifie ni l'exactitude juridique, ni l'argumentation, ni la pertinence de ta conclusion. Utilise la grille après avoir consulté le corrigé.</p></div></div>`}
function renderMethod(){let steps=[['Qualifier les faits','Relever les personnes, leurs qualités (associé, dirigeant, créancier, tiers), la forme sociale, les actes, dates et documents. Écarter les détails sans utilité juridique.'],['Formuler le problème de droit','Écrire une question abstraite et précise, sans recopier l’énoncé : « Une personne qui contracte avant immatriculation reste-t-elle engagée après la création de la société ? »'],['Énoncer la majeure','Citer la règle pertinente, l’article si connu, ses conditions, exceptions, sanctions et éventuellement la jurisprudence. Ne pas mentionner un texte dont on ignore le contenu.'],['Appliquer la mineure','Vérifier chaque condition avec un fait concret : « Ici, le bail est inscrit à l’état annexé… » ; discuter les incertitudes et les éléments manquants.'],['Conclure','Répondre explicitement, sans éluder. Énoncer la sanction exacte : caution poursuivable, clause réputée non écrite, acte repris, société non immatriculée, nullité conditionnée…'],['Reprendre pour chaque problème','Un cas à trois difficultés = trois mini-syllogismes. Séparer les solutions et éviter les généralités.']];let sample=`FAITS QUALIFIÉS\nEmma a signé un bail au nom et pour le compte d’une SAS en formation. Un état de cet acte a été annexé aux statuts. La société a ensuite été immatriculée. Le bailleur réclame personnellement les loyers à Emma.\n\nPROBLÈME DE DROIT\nLa personne ayant contracté pour une société en formation reste-t-elle tenue après l’immatriculation lorsque l’acte a été régulièrement repris ?\n\nMAJEURE — EN DROIT\nEn application de l’article L.210-6 du Code de commerce, les personnes qui agissent au nom d’une société en formation répondent en principe de leurs engagements. Toutefois, la société régulièrement immatriculée peut reprendre les actes accomplis pour son compte selon les modalités légales, notamment par un état des actes annexé aux statuts (art. R.210-5 s.). La reprise produit un effet rétroactif.\n\nMINEURE — EN L’ESPÈCE\nEmma a signé un bail explicitement pour la SAS en formation. Le bail est identifié dans l’état des engagements annexé aux statuts et la SAS est immatriculée. Sous réserve que les formalités aient été régulièrement accomplies, les conditions de reprise sont réunies.\n\nCONCLUSION\nLa SAS est réputée débitrice du bail dès l’origine ; les loyers repris ne sont, en principe, pas dus personnellement par Emma au seul titre de sa signature initiale.`;return ptitle('Méthode du syllogisme','Réussir une étude de cas','La différence entre connaître un cours et réussir un examen : toujours appliquer une règle à des faits précis.')+`<div class="callout info mb-1">${ico('scale',23)}<div><strong>Le schéma qui fonctionne : qualification → question → règle → application → conclusion</strong><p>Le professeur évalue le raisonnement, pas la longueur. Une bonne copie n’empile pas les articles : elle traite toutes les conditions utiles et donne une conclusion juridiquement précise.</p></div></div><div class="grid two mt-3" style="align-items:start"><div class="card"><h2 class="section-title mt-0">La méthode en 6 étapes</h2>${steps.map((s,i)=>`<div class="methods-step"><div class="num">${i+1}</div><div><h3>${e(s[0])}</h3><p>${e(s[1])}</p></div></div>`).join('')}</div><div><div class="card"><h2 class="section-title mt-0">Plan pour chaque question</h2><div class="mini-step"><b>1. En droit…</b><p>« Aux termes de l’article…, [règle], sous réserve de… »</p></div><div class="mini-step mt-1"><b>2. En l’espèce…</b><p>« Or, [fait précis], ce qui remplit / ne remplit pas la condition de… »</p></div><div class="mini-step mt-1"><b>3. Par conséquent…</b><p>« Dès lors, [solution] ; toutefois, [réserve si information manquante]. »</p></div><button class="btn outline sm mt-2" data-action="copyMethod">${ico('file',14)} Copier le modèle de rédaction</button></div><div class="card mt-2"><h3 class="card-title mt-0">La checklist du professeur</h3>${['Contrat de société ?','Apports, résultats et affectio ?','Quelle forme sociale ?','Personnalité morale acquise ?','Qui a conclu l’acte ?','Quelle irrégularité réelle ?','Quelle sanction exacte et quelle régularisation ?'].map((x,i)=>`<div class="checkitem"><span class="chip blue">${i+1}</span>${e(x)}</div>`).join('')}</div><div class="callout warn mt-2">${ico('alert',19)}<div><strong>5 erreurs qui coûtent des points</strong><p>Réciter sans appliquer ; oublier le bon code ou la date ; confondre nullité de clause et société ; conclure sans condition ; traiter trois problèmes en un seul bloc.</p></div></div></div><h2 class="section-title">Exemple de copie rédigée</h2><p class="page-sub">Exemple inspiré du cas de la société en formation.</p><div class="method-sample">${e(sample)}</div><div class="rowbuttons mt-2"><button class="btn primary" data-action="case" data-id="c4">Faire le cas sans aide ${ico('arrow',15)}</button><button class="btn outline" data-action="nav" data-id="exam">Passer à l’examen blanc</button></div>`}
function startQuiz(){let qty=Number($('#quizQty')?.value||15),topic=$('#quizTopic')?.value||'all';let pool=DB.quizzes.filter(q=>topic==='all'||q.topic===topic).slice();for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]};ui.quiz={questions:pool.slice(0,qty),index:0,answers:{},finished:false,selected:null,topic};render();toast('Session de quiz démarrée')}
function renderQuiz(){let q=ui.quiz;if(!q){let topics=['all',...new Set(DB.quizzes.map(x=>x.topic))];return ptitle('Mémoire active','Quiz interactifs',`${DB.quizzes.length} questions à réponse unique, avec explication immédiate et suivi des résultats.`)+`<div class="card" style="max-width:720px;margin:25px auto;padding:30px"><div class="eyebrow">NOUVELLE SESSION</div><h2 style="font-size:25px;letter-spacing:-.04em;margin:8px 0">Teste tes connaissances</h2><p class="muted small">Sélectionne un thème ou mélange tous les chapitres. Les réponses sont vérifiées localement, sans connexion.</p><div class="grid two mt-3"><div><label class="label" for="quizTopic">Thème</label><select class="select" id="quizTopic" style="width:100%"><option value="all">Tous les thèmes</option>${topics.slice(1).map(id=>`<option value="${e(id)}">${e(DB.modules.find(m=>m.id===id)?.title||id)}</option>`).join('')}</select></div><div><label class="label" for="quizQty">Nombre de questions</label><select class="select" id="quizQty" style="width:100%"><option value="10">10 questions · rapide</option><option value="15" selected>15 questions · standard</option><option value="30">30 questions · approfondi</option><option value="73">Toutes les questions du thème</option></select></div></div><button class="btn primary mt-3" data-action="startQuiz">Lancer le quiz ${ico('arrow',14)}</button><div class="divider mt-3"></div><p class="small muted">${store.quizResults.length?`Dernier résultat : ${store.quizResults.at(-1).percent} % · ${store.quizResults.at(-1).total} questions`:'Pas encore de session effectuée.'}</p></div>`}
